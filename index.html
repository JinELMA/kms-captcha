<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MapleStory Worlds - 메이플 운영자 GM Check</title>
  <style>
    * { box-sizing: border-box; user-select: none; font-family: "Gulim", "Dotum", "Malgun Gothic", sans-serif; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      padding: 20px;
    }

    /* KHUNG THOẠI GM GỐC */
    .gm-window-frame {
      position: relative;
      width: 700px;
      height: 318px;
      background-image: url('gm_box.png');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.9);
      border-radius: 4px;
    }

    /* KHU VỰC THAY ĐỔI CÂU HỎI NGẪU NHIÊN (PHỦ ĐÈ NỀN TRẮNG) */
    .question-overlay-panel {
      position: absolute;
      top: 8.5%;
      left: 28.5%;
      width: 68.5%;
      height: 59.5%;
      background: #ffffff;
      color: #000000;
      padding: 6px 10px;
      font-size: 12.5px;
      line-height: 1.5;
      font-weight: 500;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      overflow-y: auto;
    }

    /* ĐỊNH DẠNG CHỮ XẾP DỌC CHỐNG BOT */
    .vertical-grid-wrap {
      display: flex;
      gap: 16px;
      font-size: 13.5px;
      font-weight: bold;
      letter-spacing: 2px;
      line-height: 1.5;
      padding: 4px 6px;
      color: #000;
    }
    .vert-col {
      display: flex;
      flex-direction: column;
      text-align: center;
    }

    /* Ô NHẬP LIỆU GÕ CHỮ TIẾNG HÀN (ĐÈ LÊN Ô INPUT CỦA ẢNH) */
    .input-overlay-field {
      position: absolute;
      top: 69.6%;
      left: 30.6%;
      width: 48.8%;
      height: 7.8%;
      background: transparent;
      border: 1px solid transparent;
      padding: 2px 6px;
      font-size: 13px;
      font-weight: bold;
      color: #000000;
      outline: none;
    }
    .input-overlay-field:focus {
      background: rgba(255, 255, 255, 0.9);
      border-color: #3b82f6;
    }

    /* NÚT BẤM XÁC NHẬN [확인] (ĐÈ LÊN NÚT CAM GÓC PHẢI) */
    .btn-overlay-confirm {
      position: absolute;
      top: 89.2%;
      left: 89.7%;
      width: 8.9%;
      height: 7.8%;
      background: rgba(255, 255, 255, 0);
      border: 1px solid transparent;
      cursor: pointer;
      border-radius: 2px;
    }
    .btn-overlay-confirm:hover {
      background: rgba(249, 115, 22, 0.25);
      border-color: #fb923c;
    }

    /* BẢNG TRỢ GIÚP DÀNH CHO NHÂN VIÊN */
    .helper-card {
      width: 700px;
      margin-top: 16px;
      background: #1e293b;
      border: 1.5px solid #38bdf8;
      border-radius: 6px;
      padding: 12px 16px;
      font-size: 13px;
      color: #cbd5e1;
    }
    .helper-title {
      color: #facc15;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .helper-sample {
      margin-top: 6px;
      background: #0f172a;
      border: 1px dashed #475569;
      border-radius: 4px;
      padding: 6px 10px;
      font-family: 'Consolas', monospace;
      color: #4ade80;
      font-weight: bold;
    }

    .score-badge {
      margin-top: 14px;
      padding: 6px 20px;
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.9);
      font-size: 14px;
      font-weight: bold;
      border: 1px solid #475569;
    }
    .score-badge b { color: #facc15; }
  </style>
</head>
<body>

  <!-- KHUNG ẢNH THOẠI GM GỐC NGUYÊN VẸN -->
  <div class="gm-window-frame">
    <!-- 1. Vùng hiển thị câu hỏi ngẫu nhiên -->
    <div class="question-overlay-panel" id="questionBox">
      Đang tải câu hỏi...
    </div>

    <!-- 2. Ô gõ câu trả lời -->
    <input type="text" class="input-overlay-field" id="answerInput" placeholder="Gõ tiếng Hàn..." autocomplete="off" autofocus>

    <!-- 3. Nút bấm xác nhận đè lên nút 확인 -->
    <button class="btn-overlay-confirm" id="confirmBtn" onclick="handleConfirm()" title="확인"></button>
  </div>

  <!-- BẢNG HƯỚNG DẪN DÀNH CHO NHÂN VIÊN HUẤN LUYỆN -->
  <div class="helper-card">
    <div class="helper-title">📋 HƯỚNG DẪN DÀNH CHO NHÂN VIÊN</div>
    <div id="guideText">Đang tải hướng dẫn...</div>
    <div class="helper-sample" id="sampleAnswer">Đáp án mẫu: ...</div>
  </div>

  <div class="score-badge">Đúng: <b id="scoreVal">0</b> | Chuỗi liên tiếp: <b id="streakVal">0</b></div>

  <script>
    // KHO 5 DẠNG CÂU HỎI THỰC TẾ TRONG MAPLE PLANET
    const QUESTIONS = [
      // 1. Miêu tả bãi săn >= 8 ký tự (Đúng như ảnh gốc của bạn)
      {
        render: () => `
          <div style="color: #dc2626; font-weight: bold; margin-bottom: 3px;">[ 요 청 사 항 ]</div>
          <div style="color: #dc2626; font-weight: bold; margin-bottom: 8px;">현재 사냥터의 풍경을 자유롭게 8글자 이상 적어주세요.</div>
          <div style="color: #2563eb; font-weight: bold; margin-bottom: 3px;">[ 규 칙 안 내 ]</div>
          <div style="color: #2563eb; font-size: 11.5px; line-height: 1.4;">
            ※ 한글로 입력 → 숫자, 영문, 공백, 특수문자는 제외<br>
            ※ 캐릭터명, 닉네임, 몬스터명 입력은 제외해 주세요.
          </div>
          <div style="color: #db2777; font-weight: bold; margin-top: 8px; font-size: 12px;">
            요청 사항/규칙을 확인 후, 요청된 답안을 입력하세요.
          </div>
        `,
        guide: "Miêu tả tự do về bãi săn bằng tiếng Hàn từ <b>8 ký tự trở lên</b>. Không khoảng trắng, không số, không ký tự đặc biệt.",
        sample: "나무가많고시원한사냥터 (Khu săn nhiều cây xanh mát mẻ)",
        validate: (val) => {
          const clean = val.replace(/\s+/g, '');
          return clean.length >= 8 && /^[가-힣]+$/.test(clean);
        }
      },

      // 2. Chữ xếp dọc chống bot
      {
        render: () => `
          <div style="color: #dc2626; font-weight: bold; margin-bottom: 4px;">[ 보 안 문 자 ] 세로로 읽고 사냥터 이름을 입력하세요:</div>
          <div class="vertical-grid-wrap">
            <div class="vert-col"><span>현</span><span>재</span></div>
            <div class="vert-col"><span>사</span><span>냥</span><span>터</span><span>의</span></div>
            <div class="vert-col"><span>이</span><span>름</span><span>을</span><span>입</span><span>력</span><span>해</span><span>주</span><span>세</span></div>
            <div class="vert-col"><span>요</span></div>
          </div>
          <div style="color: #db2777; font-size: 11.5px; margin-top: 6px;">
            ※ 글자를 위에서 아래로 읽고 사냥터 이름을 입력해 주세요.
          </div>
        `,
        guide: "Đọc 4 cột dọc từ trên xuống: <b>현재 사냥터의 이름을 입력해 주세요</b> (Hãy nhập tên bãi săn hiện tại).",
        sample: "헤네시스 (Henesys) hoặc 개미굴 (Ant Tunnel)",
        validate: (val) => val.trim().length >= 2 && /^[가-힣]+$/.test(val.replace(/\s+/g, ''))
      },

      // 3. Tổ hợp 3 câu hỏi ngăn cách bởi dấu /
      {
        render: () => `
          <div style="color: #dc2626; font-weight: bold; margin-bottom: 4px;">[알림] 아래의 3가지 문제를 풀어주세요.</div>
          <div style="font-size: 12px; line-height: 1.4;">
            <b>[1번문제]</b> 우리나라의 국가명은?<br>
            <b>[2번문제]</b> 생각나는 보스 몬스터 이름은?<br>
            <b>[3번문제]</b> 현재 접속중인 내 캐릭터의 이름은?
          </div>
          <div style="color: #dc2626; font-size: 11.5px; font-weight: bold; margin-top: 6px;">
            답변 예시 : 대한민국 / 자쿰 / 홍길동
          </div>
        `,
        guide: "Trả lời đúng 3 phần ngăn cách bởi dấu gạch chéo <b>/</b>: Quốc gia / Tên Boss / Tên nhân vật.",
        sample: "대한민국 / 자쿰 / 진안대군파보",
        validate: (val) => {
          const parts = val.split('/');
          return parts.length === 3 && parts.every(p => p.trim().length > 0);
        }
      },

      // 4. 10 chữ Hangul khác nhau không trùng
      {
        render: () => `
          <div style="color: #dc2626; font-weight: bold; margin-bottom: 4px;">[ 요 청 사 항 ]</div>
          <div style="font-weight: bold; margin-bottom: 6px;">서로 다른 한글 10글자를 임의로 입력해 주세요.</div>
          <div style="color: #2563eb; font-size: 11.5px; line-height: 1.4;">
            ※ 같은 글자 반복 및 가나다라 순차 입력은 제외<br>
            ※ 숫자, 영문, 공백, 특수문자는 제외
          </div>
        `,
        guide: "Nhập đúng <b>10 chữ Hangul khác nhau hoàn toàn</b>, không có khoảng trắng, không số.",
        sample: "동서남북갑을병정무기",
        validate: (val) => {
          const clean = val.replace(/\s+/g, '');
          const set = new Set(clean);
          return clean.length >= 10 && set.size >= 10 && /^[가-힣]+$/.test(clean);
        }
      },

      // 5. Xác nhận tên nhân vật và nghề
      {
        render: () => `
          <div style="font-weight: bold; margin-bottom: 6px;">안녕하세요. 메이플 플레이어 확인 진행중입니다.</div>
          <div style="font-weight: bold; margin-bottom: 8px;">아래 칸에 자신의 캐릭터 이름과 직업을 입력하세요.</div>
          <div style="color: #2563eb; font-size: 11.5px;">
            ※ 현재 접속중인 캐릭터 이름과 직업입니다.
          </div>
        `,
        guide: "Nhập tên nhân vật kèm nghề nghiệp đang chơi (ví dụ: Tên + Nghề).",
        sample: "진안대군파보 썬콜",
        validate: (val) => val.trim().length >= 4
      }
    ];

    let currentQ = null;
    let score = 0, streak = 0;

    const questionBox = document.getElementById('questionBox');
    const answerInput = document.getElementById('answerInput');
    const guideText = document.getElementById('guideText');
    const sampleAnswer = document.getElementById('sampleAnswer');
    const scoreVal = document.getElementById('scoreVal');
    const streakVal = document.getElementById('streakVal');

    function loadRandomQuestion() {
      answerInput.value = '';
      answerInput.focus();

      currentQ = QUESTIONS[Math.floor(Math.random() * QUESTIONS.length)];
      questionBox.innerHTML = currentQ.render();
      guideText.innerHTML = currentQ.guide;
      sampleAnswer.textContent = "Đáp án mẫu: " + currentQ.sample;
    }

    function handleConfirm() {
      const val = answerInput.value;

      if (currentQ && currentQ.validate(val)) {
        score++;
        streak++;
        alert("★ 통과 (Chính xác! Hoàn thành xác thực GM)");
      } else {
        streak = 0;
        alert("✖ 실패 (Câu trả lời không đúng quy tắc hoặc sai định dạng!)");
      }

      scoreVal.textContent = score;
      streakVal.textContent = streak;
      loadRandomQuestion();
    }

    answerInput.onkeydown = (e) => {
      if (e.key === 'Enter') {
        handleConfirm();
      }
    };

    loadRandomQuestion();
  </script>
</body>
</html>

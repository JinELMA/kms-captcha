<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MapleStory KMS Captcha Hub</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      font-family: "Malgun Gothic", "Dotum", -apple-system, sans-serif;
    }

    /* Nền bên ngoài là bối cảnh MapleStory */
    body {
      margin: 0;
      padding: 15px;
      min-height: 100vh;
      background: linear-gradient(rgba(10, 25, 45, 0.45), rgba(10, 25, 45, 0.65)),
                  url('https://images.alphacoders.com/279/279287.jpg') center/cover no-repeat fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    /* Thanh điều hướng chọn chế độ ở trên cùng */
    .hub-navbar {
      width: 480px;
      margin-bottom: 16px;
      background: rgba(14, 23, 38, 0.92);
      border: 1px solid #3b82f6;
      border-radius: 8px;
      padding: 8px;
      display: flex;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    .nav-btn {
      flex: 1;
      padding: 9px 8px;
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .nav-btn.active {
      background: #f59e0b;
      color: #0f172a;
      border-color: #f59e0b;
    }

    /* ========================================================
       1. GIAO DIỆN CAPTCHA 15S CHUẨN ẢNH GỐC (BLUE BOX)
       ======================================================== */
    .kms-blue-box {
      width: 275px;
      background: #18488e;
      border: 2px solid #2b67be;
      border-radius: 6px;
      padding: 18px 14px 20px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.8), 0 0 15px rgba(27, 86, 173, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* Đồng hồ số vàng đếm ngược */
    .kms-timer-yellow {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 42px;
      font-weight: 800;
      color: #ffe600;
      text-shadow: 0 0 8px rgba(255, 230, 0, 0.5);
      line-height: 1;
      margin-bottom: 8px;
    }

    /* Tiêu đề tiếng Hàn */
    .kms-title {
      font-size: 13.5px;
      color: #ffffff;
      margin-bottom: 14px;
      font-weight: 500;
      letter-spacing: -0.5px;
      text-align: center;
    }

    /* Danh sách 5 dòng đáp án màu xám xanh */
    .kms-options-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .kms-opt-btn {
      width: 100%;
      min-height: 38px;
      background-color: #bad3eb;
      border: 1px solid #7c9fbe;
      border-radius: 3px;
      color: #1a222a;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 4px 10px;
      cursor: pointer;
      transition: background-color 0.1s;
    }

    .kms-opt-btn:hover {
      background-color: #d1e5f8;
    }

    .kms-opt-btn.correct {
      background-color: #4ade80 !important;
      border-color: #16a34a !important;
      color: #052e16 !important;
    }

    .kms-opt-btn.wrong {
      background-color: #f87171 !important;
      border-color: #dc2626 !important;
      color: #fff !important;
    }

    /* ========================================================
       2. GIAO DIỆN CAPTCHA HÌNH ẢNH (KHUNG TRẮNG KMS)
       ======================================================== */
    .kms-white-card {
      width: 480px;
      background: #ffffff;
      border-radius: 12px;
      padding: 16px 20px 22px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.6);
      position: relative;
    }

    .timer-badge-white {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      color: #333;
      font-size: 20px;
      font-weight: 700;
      font-family: 'Consolas', monospace;
      margin-bottom: 8px;
    }

    .timer-icon {
      width: 18px;
      height: 18px;
      border: 3px solid #7bc52c;
      border-radius: 50%;
      position: relative;
    }
    .timer-icon::after {
      content: '';
      position: absolute;
      width: 2px;
      height: 5px;
      background: #7bc52c;
      top: 2px;
      left: 5px;
    }

    .stage-area {
      width: 100%;
      height: 180px;
      background: #23272d;
      border-radius: 6px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 20px;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.7);
    }

    .game-item {
      display: inline-block;
      font-size: 42px;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
    }

    /* Hiệu ứng chuyển động */
    @keyframes moveH { 0%, 100% { transform: translateX(-18px); } 50% { transform: translateX(18px); } }
    @keyframes moveV { 0%, 100% { transform: translateY(-16px); } 50% { transform: translateY(16px); } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }
    @keyframes pulse { 0%, 100% { transform: scale(0.8); } 50% { transform: scale(1.3); } }

    .anim-h { animation: moveH var(--s, 1.5s) ease-in-out infinite alternate; }
    .anim-v { animation: moveV var(--s, 1.4s) ease-in-out infinite alternate; }
    .anim-blink { animation: blink var(--s, 0.8s) steps(2, start) infinite; }
    .anim-pulse { animation: pulse var(--s, 1.2s) ease-in-out infinite alternate; }

    .question-box {
      margin: 14px 0 10px;
      font-size: 15px;
      font-weight: 700;
      color: #222;
      line-height: 1.4;
      min-height: 42px;
    }
    .question-box span.q-tag {
      color: #7bc52c;
      font-weight: 800;
      margin-right: 4px;
    }

    .ox-container {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin: 14px 0;
    }
    .ox-btn {
      width: 88px;
      height: 88px;
      border: 2px solid #e1e6eb;
      background: #fdfdfd;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      font-weight: 900;
      cursor: pointer;
    }
    .ox-btn.o { color: #38b6c8; }
    .ox-btn.x { color: #eb547c; }
    .ox-btn:hover { background: #f0f7f9; }
    .ox-btn.selected { border-color: #333; background: #eaf1f5; }

    .choices-container {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin: 10px 0;
    }
    .choice-row {
      display: flex;
      align-items: center;
      background: #ffffff;
      border: 1px solid #dcdfe3;
      border-radius: 6px;
      padding: 9px 12px;
      cursor: pointer;
      font-size: 13.5px;
      color: #444;
      font-weight: 600;
    }
    .choice-row:hover { background: #f6f8fa; }
    .choice-row.selected { background: #eef7e6; border-color: #8bc34a; }
    .choice-num {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #bac2cb;
      color: #fff;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 10px;
      font-weight: 700;
    }
    .choice-row.selected .choice-num { background: #7bc52c; }

    .confirm-btn {
      width: 100px;
      height: 36px;
      background: #b5bcc4;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-weight: 700;
      font-size: 14px;
      margin: 12px auto 0;
      display: block;
      cursor: not-allowed;
    }
    .confirm-btn.active {
      background: #8bc34a;
      cursor: pointer;
    }

    /* Bảng điểm dưới cùng */
    .score-footer {
      margin-top: 14px;
      font-size: 14px;
      font-weight: 600;
      color: #f1f5f9;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    .score-footer b { color: #facc15; }
  </style>
</head>
<body>

  <!-- Menu chọn qua lại giữa 2 dạng Captcha -->
  <div class="hub-navbar">
    <button class="nav-btn active" id="tabSentence" onclick="changeMode('SENTENCE')">
      📝 Dạng 1: Câu chữ tiếng Hàn (15 Giây)
    </button>
    <button class="nav-btn" id="tabImage" onclick="changeMode('IMAGE')">
      🖼️ Dạng 2: Hình ảnh Lie Detector (O/X & 4 Câu)
    </button>
  </div>

  <!-- KHUNG 1: CÂU HỎI TIẾNG HÀN 15S (GIAO DIỆN CHUẨN ẢNH BẠN GỬI) -->
  <div class="kms-blue-box" id="sentenceBox">
    <div class="kms-timer-yellow" id="blueTimer">15</div>
    <div class="kms-title">올바른 문장을 선택해 주세요</div>
    <div class="kms-options-group" id="blueOptions">
      <!-- 5 dòng đáp án sẽ tự động sinh ngẫu nhiên ở đây -->
    </div>
  </div>

  <!-- KHUNG 2: LIE DETECTOR HÌNH ẢNH ĐỘNG -->
  <div class="kms-white-card" id="imageBox" style="display: none;">
    <div class="timer-badge-white">
      <div class="timer-icon"></div>
      <span id="whiteTimerText">01:52</span>
    </div>

    <div class="stage-area" id="sceneContainer"></div>

    <div class="question-box">
      <span class="q-tag">Q.</span><span id="questionText">Đang tải...</span>
    </div>

    <div id="answerArea"></div>
    <button class="confirm-btn" id="confirmBtn">확인</button>
  </div>

  <div class="score-footer">
    Số câu đúng: <b id="scoreVal">0</b> | Chuỗi liên tiếp: <b id="streakVal">0</b>
  </div>

  <script>
    // DỮ LIỆU CÂU HỎI 15S (CHỌN CÂU CÓ NGHĨA)
    const SENTENCE_BANK = [
      {
        correct: "여기에서 타시면 돼요.",
        wrongs: [
          "놓은 를을 베틱거나 히싣다.",
          "알창 미정을 시내다.",
          "서시해서 나기면 돼요.",
          "뜻에 씌게 항펀죄다."
        ]
      },
      {
        correct: "내일 비가 올 것 같아요.",
        wrongs: [
          "내일 비가 옷 같 것애요.",
          "비가 올 개 갓내요.",
          "나일 피가 옫 겄가타요.",
          "냬일 비가 올 켯같애요."
        ]
      },
      {
        correct: "사냥터에서 몬스터를 처치하세요.",
        wrongs: [
          "산앙터에서 먼스터를 저치헤새요.",
          "사냥텨애서 몬스토를 처지하새요.",
          "사냥터애셔 몬스터를 쳐치하새요.",
          "샤냥터에서 몬스털를 처치해새요."
        ]
      },
      {
        correct: "오늘 날씨가 정말 좋습니다.",
        wrongs: [
          "오눌 날시가 정발 죻슴니다.",
          "오늘 낟씨가 졍말 좃습니다.",
          "오늘 날씨가 점말 좋습니댜.",
          "오늩 날씨개 정말 졷슴니다."
        ]
      },
      {
        correct: "인벤토리가 가득 찼습니다.",
        wrongs: [
          "인벤토리과 가둑 찻슴니다.",
          "인벤토리가 가득 찾습니다.",
          "임벤토리가 가득 찻슴니다.",
          "인벤토리개 가득 챳습니다."
        ]
      }
    ];

    // DỮ LIỆU 8 DẠNG ẢNH BẠN GỬI
    const IMAGE_BANK = [
      {
        type: "OX",
        scene: ["🍑", "🍰", "🍍", "🍑"],
        question: "파인애플은 케이크 바로 옆에 보입니다",
        ans: "O"
      },
      {
        type: "CHOICE",
        scene: ["🍜", "⬆️", "🔦", "🍓"],
        question: "적어도 1개의 화살표는 _____ 방향을 향하고 있습니다",
        choices: ["하단", "위쪽", "왼쪽", "정답 없음"],
        ans: 1
      },
      {
        type: "CHOICE",
        scene: ["🍇", "🔄", "💍", "💊", "🦑"],
        question: "다음 화면과 관련된 문장 중 정확한 것을 한 개 찾아 주세요",
        choices: [
          "그림 안에 팥빙수가 존재합니다",
          "반지는 이미지에 위치해 있습니다",
          "왼쪽에서 두 번째 위치에 화살표가 있습니다",
          "정답 없음"
        ],
        ans: 2
      },
      {
        type: "OX",
        scene: ["🍕", "🍎", "🍎", "👒", "🔘", "🍇"],
        question: "오렌지와 장갑 사이에 있는 물체는 모자입니다",
        ans: "X"
      },
      {
        type: "CHOICE",
        scene: ["👓", "🥾", "🍌", "🥾", "🍉", "🍉"],
        question: "안경의 개수가 [ ]보다 더 적습니다",
        choices: ["신발", "오렌지", "컵라면", "정답 없음"],
        ans: 0
      },
      {
        type: "CHOICE",
        scene: ["🍌", "💊", "🧦", "🍌"],
        question: "그림과 관련된 설명 중 알맞은 것을 1개 찾아 주세요",
        choices: [
          "이미지 안에 두 개 있는 물체는 사과입니다",
          "그림 안에서 찾을 수 있는 물체는 바나나입니다",
          "그림에서 트로피는 가장 개수가 많습니다",
          "정답 없음"
        ],
        ans: 1
      },
      {
        type: "CHOICE",
        scene: ["🍧", "🔦", "👆", "🔦", "🍔"],
        question: "다음의 그림과 관련된 문장 중 정확한 것을 1개 선택해 주세요",
        choices: [
          "삼각김밥은 햄버거보다 개수가 더 많습니다",
          "햄버거는 위쪽부터 네 번째 순서에 놓여 있습니다",
          "그림에서 찾을 수 있는 손전등의 개수는 홀수입니다",
          "정답 없음"
        ],
        ans: 1
      },
      {
        type: "CHOICE",
        scene: ["💍", "💊", "🍍", "👓"],
        question: "알약은 [ ] 바로 옆에 나타나 있습니다",
        choices: ["장갑", "수박", "반지", "정답 없음"],
        ans: 2
      }
    ];

    const ANIMATIONS = ["anim-h", "anim-v", "anim-blink", "anim-pulse", ""];

    let currentMode = "SENTENCE";
    let score = 0;
    let streak = 0;
    let timerId = null;
    let timeLeft = 15;
    let selectedAns = null;
    let isLocked = false;

    const scoreVal = document.getElementById("scoreVal");
    const streakVal = document.getElementById("streakVal");
    const sentenceBox = document.getElementById("sentenceBox");
    const imageBox = document.getElementById("imageBox");
    const tabSentence = document.getElementById("tabSentence");
    const tabImage = document.getElementById("tabImage");

    function changeMode(mode) {
      currentMode = mode;
      tabSentence.classList.toggle("active", mode === "SENTENCE");
      tabImage.classList.toggle("active", mode === "IMAGE");

      sentenceBox.style.display = (mode === "SENTENCE") ? "flex" : "none";
      imageBox.style.display = (mode === "IMAGE") ? "block" : "none";

      loadQuestion();
    }

    function updateScore() {
      scoreVal.textContent = score;
      streakVal.textContent = streak;
    }

    function loadQuestion() {
      clearInterval(timerId);
      isLocked = false;

      if (currentMode === "SENTENCE") {
        loadSentenceQuestion();
      } else {
        loadImageQuestion();
      }
    }

    // ================= XỬ LÝ DẠNG CÂU 15S =================
    function loadSentenceQuestion() {
      timeLeft = 15;
      const timerEl = document.getElementById("blueTimer");
      timerEl.textContent = timeLeft;

      timerId = setInterval(() => {
        timeLeft--;
        timerEl.textContent = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timerId);
          streak = 0;
          updateScore();
          loadQuestion();
        }
      }, 1000);

      const qData = SENTENCE_BANK[Math.floor(Math.random() * SENTENCE_BANK.length)];
      const list = [
        { text: qData.correct, isOk: true },
        ...qData.wrongs.map(w => ({ text: w, isOk: false }))
      ].sort(() => Math.random() - 0.5);

      const optionsWrap = document.getElementById("blueOptions");
      optionsWrap.innerHTML = "";

      list.forEach(item => {
        const btn = document.createElement("button");
        btn.className = "kms-opt-btn";
        btn.textContent = item.text;

        btn.onclick = () => {
          if (isLocked) return;
          isLocked = true;
          clearInterval(timerId);

          if (item.isOk) {
            btn.classList.add("correct");
            score++;
            streak++;
          } else {
            btn.classList.add("wrong");
            streak = 0;
            // Làm nổi bật câu đúng
            optionsWrap.querySelectorAll(".kms-opt-btn").forEach(b => {
              if (b.textContent === qData.correct) b.classList.add("correct");
            });
          }

          updateScore();
          setTimeout(loadQuestion, 700);
        };
        optionsWrap.appendChild(btn);
      });
    }

    // ================= XỬ LÝ DẠNG HÌNH ẢNH =================
    function loadImageQuestion() {
      selectedAns = null;
      timeLeft = 112; // 01:52
      const timerText = document.getElementById("whiteTimerText");
      const confirmBtn = document.getElementById("confirmBtn");
      confirmBtn.classList.remove("active");

      function renderWhiteTime() {
        const m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
        const s = String(timeLeft % 60).padStart(2, '0');
        timerText.textContent = `${m}:${s}`;
      }
      renderWhiteTime();

      timerId = setInterval(() => {
        timeLeft--;
        renderWhiteTime();
        if (timeLeft <= 0) {
          clearInterval(timerId);
          streak = 0;
          updateScore();
          loadQuestion();
        }
      }, 1000);

      const data = IMAGE_BANK[Math.floor(Math.random() * IMAGE_BANK.length)];
      const scene = document.getElementById("sceneContainer");
      const questionText = document.getElementById("questionText");
      const answerArea = document.getElementById("answerArea");

      scene.innerHTML = "";
      data.scene.forEach(it => {
        const sp = document.createElement("span");
        sp.className = "game-item";
        sp.textContent = it;
        const anim = ANIMATIONS[Math.floor(Math.random() * ANIMATIONS.length)];
        if (anim) {
          sp.classList.add(anim);
          sp.style.setProperty("--s", (0.8 + Math.random() * 1.3).toFixed(2) + "s");
        }
        scene.appendChild(sp);
      });

      questionText.textContent = data.question;
      answerArea.innerHTML = "";

      if (data.type === "OX") {
        const wrap = document.createElement("div");
        wrap.className = "ox-container";
        ["O", "X"].forEach(val => {
          const btn = document.createElement("div");
          btn.className = `ox-btn ${val.toLowerCase()}`;
          btn.textContent = val;
          btn.onclick = () => {
            wrap.querySelectorAll(".ox-btn").forEach(b => b.classList.remove("selected"));
            btn.classList.add("selected");
            selectedAns = val;
            confirmBtn.classList.add("active");
          };
          wrap.appendChild(btn);
        });
        answerArea.appendChild(wrap);
      } else {
        const wrap = document.createElement("div");
        wrap.className = "choices-container";
        data.choices.forEach((txt, idx) => {
          const row = document.createElement("div");
          row.className = "choice-row";
          row.innerHTML = `<span class="choice-num">${idx + 1}</span> ${txt}`;
          row.onclick = () => {
            wrap.querySelectorAll(".choice-row").forEach(r => r.classList.remove("selected"));
            row.classList.add("selected");
            selectedAns = idx;
            confirmBtn.classList.add("active");
          };
          wrap.appendChild(row);
        });
        answerArea.appendChild(wrap);
      }

      confirmBtn.onclick = () => {
        if (selectedAns === null) return;
        clearInterval(timerId);

        let ok = (data.type === "OX") ? (selectedAns === data.ans) : (selectedAns === data.ans);
        if (ok) {
          score++;
          streak++;
        } else {
          streak = 0;
        }
        updateScore();
        loadQuestion();
      };
    }

    // Khởi chạy
    loadQuestion();
  </script>
</body>
</html>

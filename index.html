<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MapleStory KMS - 5회 클릭 & 문자 입력 거탐</title>
  <style>
    * { box-sizing: border-box; user-select: none; font-family: "Malgun Gothic", Dotum, sans-serif; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(rgba(10, 18, 30, 0.45), rgba(10, 18, 30, 0.65)),
                  url('bg.jpg.jpg'), url('bg.jpg'),
                  url('https://images.alphacoders.com/279/279287.jpg') center/cover no-repeat fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    /* ================= GIAI ĐOẠN 1: BÓNG 5 LẦN (CHUẨN ẢNH 1) ================= */
    .bubble-stage-card {
      width: 600px;
      height: 420px;
      background: radial-gradient(circle at center, #15803d 0%, #064e3b 40%, #091e17 100%);
      border: 3px solid #4ade80;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Lớp hào quang & hiệu ứng lá xanh nổ tung */
    .green-blast-bg {
      position: absolute;
      top: -30px; left: -30px; right: -30px; bottom: -30px;
      background: 
        radial-gradient(ellipse at 50% 50%, rgba(163, 230, 53, 0.45) 0%, rgba(34, 197, 94, 0.25) 45%, transparent 75%),
        repeating-conic-gradient(from 0deg, rgba(234, 179, 8, 0.15) 0deg 15deg, transparent 15deg 30deg);
      animation: rotateBurst 12s linear infinite;
      pointer-events: none;
    }
    @keyframes rotateBurst {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Các dòng chữ thư pháp vàng gây nhiễu */
    .distract-text-layer {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
      font-family: 'Batang', serif;
      font-weight: 900;
      color: rgba(250, 204, 21, 0.7);
      text-shadow: 0 0 6px #854d0e;
      font-size: 20px;
      line-height: 1.5;
      padding: 30px;
      letter-spacing: 4px;
      transform: skew(-8deg, -4deg);
    }
    .fake-damage-num {
      position: absolute;
      font-family: 'Consolas', monospace;
      font-weight: 900;
      color: #fef08a;
      text-shadow: 0 0 8px #ca8a04, 0 2px 4px #000;
      pointer-events: none;
    }

    .bubble-hud {
      padding: 12px 18px;
      background: rgba(0,0,0,0.6);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      border-bottom: 2px solid rgba(74, 222, 128, 0.4);
    }
    .bubble-count-text {
      font-size: 15px;
      font-weight: 800;
      color: #fef08a;
    }
    .bubble-count-text b { font-size: 19px; color: #4ade80; }

    /* Quả bóng mục tiêu nổ sáng */
    .bubble-target-ball {
      position: absolute;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fef08a 0%, #84cc16 55%, #15803d 100%);
      border: 3px solid #ecfccb;
      box-shadow: 0 0 25px #bef264, inset 0 0 10px #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      z-index: 30;
      transition: all 0.18s ease-out;
    }
    .bubble-target-ball:active { transform: scale(0.9); }

    /* ================= GIAI ĐOẠN 2: KHUNG GÕ CHỮ (CHUẨN ẢNH 2) ================= */
    .type-stage-card {
      width: 440px;
      background: #3a2228;
      border: 3px solid #5a3a42;
      border-radius: 8px;
      padding: 24px 20px 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.95);
      position: relative;
      display: none;
      /* Nền vân gạch xưởng Ludibrium */
      background-image: 
        repeating-linear-gradient(0deg, rgba(0,0,0,0.3) 0px, rgba(0,0,0,0.3) 2px, transparent 2px, transparent 18px),
        repeating-linear-gradient(90deg, rgba(0,0,0,0.2) 0px, rgba(0,0,0,0.2) 2px, transparent 2px, transparent 36px);
    }

    /* Đồng hồ điện tử Cyan đếm lùi */
    .cyan-clock-display {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 54px;
      font-weight: 900;
      color: #38bdf8;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.7);
      text-align: center;
      line-height: 1;
      margin-bottom: 14px;
      letter-spacing: 2px;
    }

    /* Hướng dẫn tiếng Hàn màu xanh xám */
    .korean-prompt-text {
      text-align: center;
      color: #7dd3fc;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.5;
      font-style: italic;
      margin-bottom: 16px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    .lives-left-text {
      display: block;
      color: #93c5fd;
      font-size: 14px;
      margin-top: 4px;
    }

    /* Khung vẽ chữ Hangul Canvas có vết xước & nhiễu */
    .hangul-canvas-box {
      width: 100%;
      height: 90px;
      background: #ffffff;
      border: 2px solid #1e293b;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 16px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
      position: relative;
    }
    #hangulCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Ô gõ chữ tiếng Hàn */
    .hangul-input-bar {
      width: 100%;
      height: 42px;
      background: #ffffff;
      border: 2px solid #0f172a;
      border-radius: 4px;
      padding: 6px 12px;
      font-size: 16.5px;
      font-weight: bold;
      color: #000;
      outline: none;
    }

    .score-toast {
      margin-top: 16px;
      padding: 8px 24px;
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.85);
      font-weight: 700;
      font-size: 15px;
      border: 1px solid #475569;
    }
    .score-toast b { color: #facc15; }
  </style>
</head>
<body>

  <!-- 1. GIAI ĐOẠN 1: BÓNG 5 LẦN (Chuẩn ảnh 1) -->
  <div class="bubble-stage-card" id="bubbleStage">
    <div class="green-blast-bg"></div>

    <div class="distract-text-layer">
      놓은 를을 베틱거나 히싣다.<br>
      사냥터에서 몬스터를 처치하세요.<br>
      인벤토리가 가득 찼습니다.
    </div>

    <!-- Số damage trôi nổi giả lập game -->
    <div class="fake-damage-num" style="top: 140px; right: 80px; font-size: 26px;">1181 COMBO</div>
    <div class="fake-damage-num" style="bottom: 80px; left: 40px; font-size: 28px;">48031 12975254</div>

    <div class="bubble-hud">
      <span class="bubble-count-text">거짓말 탐지: 목표를 5회 클릭하세요</span>
      <span class="bubble-count-text">클릭 수: <b id="bubbleHits">0</b> / 5</span>
    </div>

    <!-- Mục tiêu bóng di chuyển -->
    <div class="bubble-target-ball" id="bubbleTarget">🍀</div>

    <div style="padding: 10px; z-index: 20; text-align: center; font-size: 13px; color: #cbd5e1; background: rgba(0,0,0,0.5);">
      Nhấp trúng quả bóng màu xanh lục 5 lần liên tiếp
    </div>
  </div>

  <!-- 2. GIAI ĐOẠN 2: KHUNG GÕ CHỮ (Chuẩn ảnh 2) -->
  <div class="type-stage-card" id="typeStage">
    <div class="cyan-clock-display" id="cyanTimer">49</div>

    <div class="korean-prompt-text">
      아래 이미지 안의 한글을<br>보이는 대로 입력하세요
      <span class="lives-left-text" id="livesText">세번 남았습니다</span>
    </div>

    <div class="hangul-canvas-box">
      <canvas id="hangulCanvas" width="400" height="90"></canvas>
    </div>

    <input type="text" class="hangul-input-bar" id="hangulInput" placeholder="Nhập chữ tiếng Hàn và bấm Enter..." autocomplete="off">
  </div>

  <div class="score-toast" id="scoreBar">Đúng: <b>0</b> | Chuỗi liên tiếp: <b>0</b></div>

  <script>
    // Kho từ vựng Hangul mô phỏng captcha chữ biến dạng
    const HANGUL_WORDS = [
      "애가형영것", "단풍잎바람", "자쿰의투구", "헤네시스숲", 
      "엘리니아꽃", "루디브리엄", "시그너스궁", "오르비스탑"
    ];

    let bubbleClicks = 0;
    let typeLives = 3;
    let remainingTime = 49;
    let timerInterval = null;
    let currentTargetWord = "";
    let score = 0, streak = 0;

    const bubbleStage = document.getElementById('bubbleStage');
    const typeStage = document.getElementById('typeStage');
    const bubbleHits = document.getElementById('bubbleHits');
    const bubbleTarget = document.getElementById('bubbleTarget');
    const cyanTimer = document.getElementById('cyanTimer');
    const livesText = document.getElementById('livesText');
    const hangulInput = document.getElementById('hangulInput');
    const canvas = document.getElementById('hangulCanvas');
    const ctx = canvas.getContext('2d');

    // ================= KHỞI TẠO BÓNG 5 LẦN =================
    function startBubblePhase() {
      clearInterval(timerInterval);
      bubbleClicks = 0;
      bubbleHits.textContent = bubbleClicks;
      bubbleStage.style.display = 'flex';
      typeStage.style.display = 'none';

      moveBubbleToRandomPos();

      bubbleTarget.onclick = () => {
        bubbleClicks++;
        bubbleHits.textContent = bubbleClicks;

        if (bubbleClicks >= 5) {
          // Hoàn thành giai đoạn 1 -> Chuyển sang giai đoạn 2
          bubbleStage.style.display = 'none';
          typeStage.style.display = 'block';
          startTypePhase();
        } else {
          moveBubbleToRandomPos();
        }
      };
    }

    function moveBubbleToRandomPos() {
      // Phạm vi khung 600 x 420 (trừ lề HUD và kích thước bóng 72px)
      const x = 30 + Math.random() * 490;
      const y = 70 + Math.random() * 260;
      bubbleTarget.style.left = x + 'px';
      bubbleTarget.style.top = y + 'px';
    }

    // ================= KHỞI TẠO GÕ CHỮ THƯ PHÁP =================
    function startTypePhase() {
      typeLives = 3;
      remainingTime = 49;
      cyanTimer.textContent = remainingTime;
      updateLivesText();

      hangulInput.value = '';
      hangulInput.focus();

      // Chọn 1 từ ngẫu nhiên và vẽ lên Canvas với các hiệu ứng biến dạng
      currentTargetWord = HANGUL_WORDS[Math.floor(Math.random() * HANGUL_WORDS.length)];
      renderDistortedHangul(currentTargetWord);

      // Đếm ngược thời gian từ 49s xuống 0
      timerInterval = setInterval(() => {
        remainingTime--;
        cyanTimer.textContent = remainingTime;

        if (remainingTime <= 0) {
          clearInterval(timerInterval);
          failChallenge("Hết thời gian (시간 초과)!");
        }
      }, 1000);

      // Lắng nghe phím Enter
      hangulInput.onkeydown = (e) => {
        if (e.key === 'Enter') {
          checkTypedAnswer();
        }
      };
    }

    function updateLivesText() {
      if (typeLives === 3) livesText.textContent = "세번 남았습니다";
      else if (typeLives === 2) livesText.textContent = "두번 남았습니다";
      else if (typeLives === 1) livesText.textContent = "한번 남았습니다";
    }

    // Hàm vẽ chữ thư pháp, vết xước và hạt muối tiêu (Salt & Pepper Noise)
    function renderDistortedHangul(text) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Nền trắng có hạt xám li ti
      ctx.fillStyle = "#fafafa";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 2. Vẽ từng ký tự chữ cái với màu sắc, góc nghiêng và độ méo khác nhau
      const colors = ["#451a03", "#0f172a", "#581c87", "#701a75", "#1c1917"];
      const charWidth = 62;
      const startX = 35;

      for (let i = 0; i < text.length; i++) {
        ctx.save();
        ctx.fillStyle = colors[i % colors.length];
        ctx.font = "900 44px 'Batang', 'Gungsuh', serif";

        const x = startX + i * charWidth;
        const y = 60 + (Math.random() * 8 - 4);
        const angle = (Math.random() * 0.2 - 0.1); // Nghiêng nhẹ

        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.fillText(text[i], 0, 0);
        ctx.restore();
      }

      // 3. Vẽ các đường gạch xước ngang và chéo xuyên qua chữ (chống đọc máy)
      for (let i = 0; i < 7; i++) {
        ctx.beginPath();
        ctx.strokeStyle = (i % 2 === 0) ? "rgba(15, 23, 42, 0.65)" : "rgba(185, 28, 28, 0.45)";
        ctx.lineWidth = 1.2 + Math.random() * 1.5;
        ctx.moveTo(Math.random() * 50, Math.random() * canvas.height);
        ctx.bezierCurveTo(
          120, Math.random() * canvas.height,
          260, Math.random() * canvas.height,
          canvas.width - 20, Math.random() * canvas.height
        );
        ctx.stroke();
      }

      // 4. Phủ lớp hạt nhiễu (noise speckles)
      for (let i = 0; i < 650; i++) {
        ctx.fillStyle = Math.random() > 0.5 ? "rgba(0,0,0,0.7)" : "rgba(120,53,15,0.6)";
        const px = Math.random() * canvas.width;
        const py = Math.random() * canvas.height;
        ctx.fillRect(px, py, 1.5, 1.5);
      }
    }

    function checkTypedAnswer() {
      const userVal = hangulInput.value.trim();

      if (userVal === currentTargetWord) {
        // Đúng
        clearInterval(timerInterval);
        score++;
        streak++;
        alert("★ 통과 (Chính xác! Bạn đã hoàn thành xác minh)");
        resetGame();
      } else {
        // Sai -> trừ mạng
        typeLives--;
        updateLivesText();
        hangulInput.value = '';

        if (typeLives <= 0) {
          clearInterval(timerInterval);
          failChallenge("Bạn đã nhập sai quá 3 lần (실패)!");
        }
      }
      document.getElementById('scoreBar').innerHTML = `Đúng: <b>${score}</b> | Chuỗi liên tiếp: <b>${streak}</b>`;
    }

    function failChallenge(msg) {
      streak = 0;
      alert("✖ 실패: " + msg);
      document.getElementById('scoreBar').innerHTML = `Đúng: <b>${score}</b> | Chuỗi liên tiếp: <b>${streak}</b>`;
      resetGame();
    }

    function resetGame() {
      startBubblePhase();
    }

    // Bắt đầu
    startBubblePhase();
  </script>
</body>
</html>

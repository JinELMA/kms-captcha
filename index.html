<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MapleStory KMS - 5회 클릭 & 문자 입력 거탐 (Training Mode)</title>
  <style>
    * { box-sizing: border-box; user-select: none; font-family: "Malgun Gothic", Dotum, sans-serif; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(rgba(10, 18, 30, 0.45), rgba(10, 18, 30, 0.65)),
                  url('bg.jpg.jpg'), url('bg.jpg'),
                  url('https://images.alphacoders.com/279/279287.jpg') center/cover no-repeat fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    /* ================= GIAI ĐOẠN 1: BÓNG 5 LẦN (ẢNH 1) ================= */
    .bubble-stage-card {
      width: 620px;
      height: 420px;
      background: radial-gradient(circle at center, #15803d 0%, #064e3b 40%, #091e17 100%);
      border: 3px solid #4ade80;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .green-blast-bg {
      position: absolute;
      top: -30px; left: -30px; right: -30px; bottom: -30px;
      background: 
        radial-gradient(ellipse at 50% 50%, rgba(163, 230, 53, 0.45) 0%, rgba(34, 197, 94, 0.25) 45%, transparent 75%),
        repeating-conic-gradient(from 0deg, rgba(234, 179, 8, 0.15) 0deg 15deg, transparent 15deg 30deg);
      animation: rotateBurst 12s linear infinite;
      pointer-events: none;
    }
    @keyframes rotateBurst {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .distract-text-layer {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
      font-family: 'Batang', serif;
      font-weight: 900;
      color: rgba(250, 204, 21, 0.7);
      text-shadow: 0 0 6px #854d0e;
      font-size: 20px;
      line-height: 1.5;
      padding: 30px;
      letter-spacing: 4px;
      transform: skew(-8deg, -4deg);
    }
    .fake-damage-num {
      position: absolute;
      font-family: 'Consolas', monospace;
      font-weight: 900;
      color: #fef08a;
      text-shadow: 0 0 8px #ca8a04, 0 2px 4px #000;
      pointer-events: none;
    }

    .bubble-hud {
      padding: 12px 18px;
      background: rgba(0,0,0,0.6);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      border-bottom: 2px solid rgba(74, 222, 128, 0.4);
    }
    .bubble-count-text {
      font-size: 15px;
      font-weight: 800;
      color: #fef08a;
    }
    .bubble-count-text b { font-size: 19px; color: #4ade80; }

    .bubble-target-ball {
      position: absolute;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fef08a 0%, #84cc16 55%, #15803d 100%);
      border: 3px solid #ecfccb;
      box-shadow: 0 0 25px #bef264, inset 0 0 10px #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      z-index: 30;
      transition: all 0.18s ease-out;
    }
    .bubble-target-ball:active { transform: scale(0.9); }

    /* ================= GIAI ĐOẠN 2: KHUNG GÕ CHỮ (ẢNH 2) ================= */
    .type-stage-card {
      width: 520px;
      background: #3a2228;
      border: 3px solid #5a3a42;
      border-radius: 10px;
      padding: 22px 20px 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.95);
      position: relative;
      display: none;
      background-image: 
        repeating-linear-gradient(0deg, rgba(0,0,0,0.3) 0px, rgba(0,0,0,0.3) 2px, transparent 2px, transparent 18px),
        repeating-linear-gradient(90deg, rgba(0,0,0,0.2) 0px, rgba(0,0,0,0.2) 2px, transparent 2px, transparent 36px);
    }

    .cyan-clock-display {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 50px;
      font-weight: 900;
      color: #38bdf8;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.7);
      text-align: center;
      line-height: 1;
      margin-bottom: 12px;
      letter-spacing: 2px;
    }

    .korean-prompt-text {
      text-align: center;
      color: #7dd3fc;
      font-size: 14.5px;
      font-weight: 700;
      line-height: 1.5;
      font-style: italic;
      margin-bottom: 14px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    .lives-left-text {
      display: block;
      color: #93c5fd;
      font-size: 14px;
      margin-top: 4px;
    }

    .hangul-canvas-box {
      width: 100%;
      height: 90px;
      background: #ffffff;
      border: 2px solid #1e293b;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 14px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }
    #hangulCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .hangul-input-bar {
      width: 100%;
      height: 42px;
      background: #ffffff;
      border: 2px solid #0f172a;
      border-radius: 4px;
      padding: 6px 12px;
      font-size: 17px;
      font-weight: bold;
      color: #000;
      outline: none;
      margin-bottom: 12px;
    }

    /* ================= BẢNG HƯỚNG DẪN GÕ PHÍM CHO NHÂN VIÊN ================= */
    .trainer-guide-panel {
      background: #1e293b;
      border: 1.5px solid #38bdf8;
      border-radius: 8px;
      padding: 12px 14px;
      margin-top: 6px;
    }
    .trainer-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .trainer-title {
      font-size: 13px;
      font-weight: 800;
      color: #facc15;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-toggle-hint {
      background: #334155;
      border: 1px solid #64748b;
      color: #cbd5e1;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-toggle-hint:hover { background: #475569; }

    .syllable-hints-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }
    .syllable-col {
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 6px 4px;
      text-align: center;
    }
    .hangul-char-badge {
      font-size: 18px;
      font-weight: 900;
      color: #38bdf8;
      display: block;
      margin-bottom: 4px;
    }
    .jamo-split-text {
      font-size: 11px;
      color: #94a3b8;
      display: block;
      margin-bottom: 6px;
    }
    .keycap-row {
      display: flex;
      justify-content: center;
      gap: 2px;
      flex-wrap: wrap;
    }
    kbd {
      background: #e2e8f0;
      color: #0f172a;
      border: 1px solid #94a3b8;
      border-bottom: 2px solid #64748b;
      border-radius: 3px;
      font-family: 'Consolas', monospace;
      font-size: 12px;
      font-weight: 900;
      padding: 1px 5px;
      display: inline-block;
      min-width: 18px;
      box-shadow: 0 1px 1px rgba(0,0,0,0.3);
    }
    kbd.shift-key {
      background: #fde047;
      border-color: #ca8a04;
    }

    .full-string-guide {
      background: #090d16;
      border: 1px dashed #64748b;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 12.5px;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .full-keys-code {
      font-family: 'Consolas', monospace;
      font-size: 15px;
      font-weight: 900;
      color: #4ade80;
      letter-spacing: 2px;
    }

    .score-toast {
      margin-top: 16px;
      padding: 8px 24px;
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.85);
      font-weight: 700;
      font-size: 15px;
      border: 1px solid #475569;
    }
    .score-toast b { color: #facc15; }
  </style>
</head>
<body>

  <!-- 1. GIAI ĐOẠN 1: BÓNG 5 LẦN (ẢNH 1) -->
  <div class="bubble-stage-card" id="bubbleStage">
    <div class="green-blast-bg"></div>

    <div class="distract-text-layer">
      놓은 를을 베틱거나 히싣다.<br>
      사냥터에서 몬스터를 처치하세요.<br>
      인벤토리가 가득 찼습니다.
    </div>

    <div class="fake-damage-num" style="top: 140px; right: 80px; font-size: 26px;">1181 COMBO</div>
    <div class="fake-damage-num" style="bottom: 80px; left: 40px; font-size: 28px;">48031 12975254</div>

    <div class="bubble-hud">
      <span class="bubble-count-text">거짓말 탐지: 목표를 5회 클릭하세요</span>
      <span class="bubble-count-text">클릭 수: <b id="bubbleHits">0</b> / 5</span>
    </div>

    <div class="bubble-target-ball" id="bubbleTarget">🍀</div>

    <div style="padding: 10px; z-index: 20; text-align: center; font-size: 13px; color: #cbd5e1; background: rgba(0,0,0,0.5);">
      Nhấp trúng quả bóng màu xanh lục 5 lần liên tiếp
    </div>
  </div>

  <!-- 2. GIAI ĐOẠN 2: KHUNG GÕ CHỮ + BẢNG HUẤN LUYỆN (ẢNH 2) -->
  <div class="type-stage-card" id="typeStage">
    <div class="cyan-clock-display" id="cyanTimer">49</div>

    <div class="korean-prompt-text">
      아래 이미지 안의 한글을<br>보이는 대로 입력하세요
      <span class="lives-left-text" id="livesText">세번 남았습니다</span>
    </div>

    <div class="hangul-canvas-box">
      <canvas id="hangulCanvas" width="480" height="90"></canvas>
    </div>

    <input type="text" class="hangul-input-bar" id="hangulInput" placeholder="Gõ chữ Hangul và bấm Enter..." autocomplete="off">

    <!-- BẢNG HƯỚNG DẪN TÁCH NÉT & PHÍM QWERTY DÀNH CHO NHÂN VIÊN -->
    <div class="trainer-guide-panel" id="trainerGuidePanel">
      <div class="trainer-header-row">
        <span class="trainer-title">⌨️ HƯỚNG DẪN GÕ PHÍM CHO NHÂN VIÊN</span>
        <button type="button" class="btn-toggle-hint" onclick="toggleHintView()" id="btnToggleHint">Ẩn gợi ý</button>
      </div>

      <div class="syllable-hints-grid" id="syllableHintsGrid"></div>

      <div class="full-string-guide" id="fullStringGuide">
        <span>Chuỗi phím gõ nhanh:</span>
        <span class="full-keys-code" id="fullKeySequence"></span>
      </div>
    </div>
  </div>

  <div class="score-toast" id="scoreBar">Đúng: <b>0</b> | Chuỗi liên tiếp: <b>0</b></div>

  <script>
    // Bảng mã tra cứu chuẩn bàn phím 2-Set Hàn Quốc (Dubeolsik sang QWERTY)
    const CHOSEONG = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
    const CHOSEONG_KEY = ['r','R','s','e','E','f','a','q','Q','t','T','d','w','W','c','z','x','v','g'];

    const JUNGSEONG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
    const JUNGSEONG_KEY = ['k','o','i','O','j','p','u','P','h','hk','ho','hl','y','n','nj','np','nl','b','m','ml','l'];

    const JONGSEONG = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
    const JONGSEONG_KEY = ['','r','R','rt','s','sw','sg','e','f','fr','fa','fq','ft','fx','fv','fg','a','q','qt','t','T','d','w','c','z','x','v','g'];

    // Hàm tự động phân rã âm tiết Hangul thành nét ghép và phím gõ QWERTY
    function decomposeHangul(char) {
      const code = char.charCodeAt(0);
      if (code < 0xAC00 || code > 0xD7A3) return null;
      const index = code - 0xAC00;
      const l = Math.floor(index / (21 * 28));
      const v = Math.floor((index % (21 * 28)) / 28);
      const t = index % 28;

      const jamos = [];
      const keys = [];

      jamos.push(CHOSEONG[l]);
      keys.push(CHOSEONG_KEY[l]);

      jamos.push(JUNGSEONG[v]);
      keys.push(JUNGSEONG_KEY[v]);

      if (t > 0) {
        jamos.push(JONGSEONG[t]);
        keys.push(JONGSEONG_KEY[t]);
      }

      return {
        char: char,
        jamoText: jamos.join(' + '),
        keys: keys,
        combinedKeys: keys.join('')
      };
    }

    const HANGUL_WORDS = [
      "애가형영것", "단풍잎바람", "자쿰의투구", "헤네시스숲", 
      "엘리니아꽃", "루디브리엄", "시그너스궁", "오르비스탑"
    ];

    let bubbleClicks = 0;
    let typeLives = 3;
    let remainingTime = 49;
    let timerInterval = null;
    let currentTargetWord = "";
    let score = 0, streak = 0;
    let hintsVisible = true;

    const bubbleStage = document.getElementById('bubbleStage');
    const typeStage = document.getElementById('typeStage');
    const bubbleHits = document.getElementById('bubbleHits');
    const bubbleTarget = document.getElementById('bubbleTarget');
    const cyanTimer = document.getElementById('cyanTimer');
    const livesText = document.getElementById('livesText');
    const hangulInput = document.getElementById('hangulInput');
    const canvas = document.getElementById('hangulCanvas');
    const ctx = canvas.getContext('2d');
    const syllableHintsGrid = document.getElementById('syllableHintsGrid');
    const fullKeySequence = document.getElementById('fullKeySequence');

    function toggleHintView() {
      hintsVisible = !hintsVisible;
      syllableHintsGrid.style.display = hintsVisible ? 'grid' : 'none';
      document.getElementById('fullStringGuide').style.display = hintsVisible ? 'flex' : 'none';
      document.getElementById('btnToggleHint').textContent = hintsVisible ? 'Ẩn gợi ý' : 'Hiện gợi ý';
    }

    function startBubblePhase() {
      clearInterval(timerInterval);
      bubbleClicks = 0;
      bubbleHits.textContent = bubbleClicks;
      bubbleStage.style.display = 'flex';
      typeStage.style.display = 'none';

      moveBubbleToRandomPos();

      bubbleTarget.onclick = () => {
        bubbleClicks++;
        bubbleHits.textContent = bubbleClicks;

        if (bubbleClicks >= 5) {
          bubbleStage.style.display = 'none';
          typeStage.style.display = 'block';
          startTypePhase();
        } else {
          moveBubbleToRandomPos();
        }
      };
    }

    function moveBubbleToRandomPos() {
      const x = 30 + Math.random() * 510;
      const y = 70 + Math.random() * 260;
      bubbleTarget.style.left = x + 'px';
      bubbleTarget.style.top = y + 'px';
    }

    function startTypePhase() {
      typeLives = 3;
      remainingTime = 49;
      cyanTimer.textContent = remainingTime;
      updateLivesText();

      hangulInput.value = '';
      hangulInput.focus();

      currentTargetWord = HANGUL_WORDS[Math.floor(Math.random() * HANGUL_WORDS.length)];
      renderDistortedHangul(currentTargetWord);
      buildKeystrokeGuide(currentTargetWord);

      timerInterval = setInterval(() => {
        remainingTime--;
        cyanTimer.textContent = remainingTime;

        if (remainingTime <= 0) {
          clearInterval(timerInterval);
          failChallenge("Hết thời gian (시간 초과)!");
        }
      }, 1000);

      hangulInput.onkeydown = (e) => {
        if (e.key === 'Enter') {
          checkTypedAnswer();
        }
      };
    }

    // Dựng bảng gợi ý ghép nét & phím tiếng Anh
    function buildKeystrokeGuide(word) {
      syllableHintsGrid.innerHTML = '';
      let totalKeys = '';

      for (let i = 0; i < word.length; i++) {
        const item = decomposeHangul(word[i]);
        if (!item) continue;

        totalKeys += item.combinedKeys + ' ';

        const col = document.createElement('div');
        col.className = 'syllable-col';

        let kbdHtml = '';
        item.keys.forEach(k => {
          for (let char of k) {
            const isShift = (char === char.toUpperCase() && char !== char.toLowerCase());
            kbdHtml += `<kbd class="${isShift ? 'shift-key' : ''}">${char}</kbd>`;
          }
        });

        col.innerHTML = `
          <span class="hangul-char-badge">${item.char}</span>
          <span class="jamo-split-text">${item.jamoText}</span>
          <div class="keycap-row">${kbdHtml}</div>
        `;
        syllableHintsGrid.appendChild(col);
      }

      fullKeySequence.textContent = totalKeys.trim();
    }

    function updateLivesText() {
      if (typeLives === 3) livesText.textContent = "세번 남았습니다";
      else if (typeLives === 2) livesText.textContent = "두번 남았습니다";
      else if (typeLives === 1) livesText.textContent = "한번 남았습니다";
    }

    function renderDistortedHangul(text) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#fafafa";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const colors = ["#451a03", "#0f172a", "#581c87", "#701a75", "#1c1917"];
      const charWidth = 74;
      const startX = 40;

      for (let i = 0; i < text.length; i++) {
        ctx.save();
        ctx.fillStyle = colors[i % colors.length];
        ctx.font = "900 46px 'Batang', 'Gungsuh', serif";

        const x = startX + i * charWidth;
        const y = 62 + (Math.random() * 8 - 4);
        const angle = (Math.random() * 0.2 - 0.1);

        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.fillText(text[i], 0, 0);
        ctx.restore();
      }

      for (let i = 0; i < 7; i++) {
        ctx.beginPath();
        ctx.strokeStyle = (i % 2 === 0) ? "rgba(15, 23, 42, 0.65)" : "rgba(185, 28, 28, 0.45)";
        ctx.lineWidth = 1.2 + Math.random() * 1.5;
        ctx.moveTo(Math.random() * 50, Math.random() * canvas.height);
        ctx.bezierCurveTo(
          140, Math.random() * canvas.height,
          300, Math.random() * canvas.height,
          canvas.width - 20, Math.random() * canvas.height
        );
        ctx.stroke();
      }

      for (let i = 0; i < 700; i++) {
        ctx.fillStyle = Math.random() > 0.5 ? "rgba(0,0,0,0.7)" : "rgba(120,53,15,0.6)";
        const px = Math.random() * canvas.width;
        const py = Math.random() * canvas.height;
        ctx.fillRect(px, py, 1.5, 1.5);
      }
    }

    function checkTypedAnswer() {
      const userVal = hangulInput.value.trim();

      if (userVal === currentTargetWord) {
        clearInterval(timerInterval);
        score++;
        streak++;
        alert("★ 통과 (Chính xác! Bạn đã hoàn thành xác minh)");
        resetGame();
      } else {
        typeLives--;
        updateLivesText();
        hangulInput.value = '';

        if (typeLives <= 0) {
          clearInterval(timerInterval);
          failChallenge("Bạn đã nhập sai quá 3 lần (실패)!");
        }
      }
      document.getElementById('scoreBar').innerHTML = `Đúng: <b>${score}</b> | Chuỗi liên tiếp: <b>${streak}</b>`;
    }

    function failChallenge(msg) {
      streak = 0;
      alert("✖ 실패: " + msg);
      document.getElementById('scoreBar').innerHTML = `Đúng: <b>${score}</b> | Chuỗi liên tiếp: <b>${streak}</b>`;
      resetGame();
    }

    function resetGame() {
      startBubblePhase();
    }

    startBubblePhase();
  </script>
</body>
</html>

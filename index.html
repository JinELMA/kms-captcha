<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MapleStory KMS - Violetta Lie Detector</title>
  <style>
    * { box-sizing: border-box; user-select: none; font-family: "Malgun Gothic", Dotum, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(rgba(10, 18, 30, 0.4), rgba(10, 18, 30, 0.65)),
                  url('bg.jpg'),
                  url('https://images.alphacoders.com/279/279287.jpg') center/cover no-repeat fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    /* ================= GIAI ĐOẠN 1: MÀN HÌNH CẢNH BÁO ================= */
    .notice-modal {
      width: 500px;
      background: #252830;
      border: 2px solid #5a6578;
      border-radius: 8px;
      box-shadow: 0 16px 45px rgba(0,0,0,0.85);
      overflow: hidden;
      display: block;
    }
    .notice-header {
      background: #1b1d24;
      padding: 10px 14px;
      font-size: 15px;
      font-weight: bold;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 2px solid #383e4d;
    }
    .notice-timer-num {
      color: #facc15;
      font-size: 20px;
      font-family: 'Consolas', monospace;
    }
    .notice-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .notice-blue-box {
      background: #0284c7;
      border: 1px solid #38bdf8;
      border-radius: 6px;
      padding: 12px 14px;
      font-size: 13.5px;
      line-height: 1.6;
      color: #ffffff;
      font-weight: bold;
    }
    .notice-blue-box span.highlight {
      color: #fef08a;
    }
    .notice-dialog-box {
      background: #383f4d;
      border: 1px solid #4f5869;
      border-radius: 6px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }
    .notice-dialog-text {
      font-size: 13px;
      color: #e2e8f0;
      line-height: 1.5;
      max-width: 320px;
      font-weight: 600;
    }
    .notice-dialog-text span.warn {
      color: #facc15;
    }
    .btn-start-now {
      margin: 4px auto 0;
      padding: 8px 24px;
      background: #ea580c;
      border: 1px solid #f97316;
      border-radius: 4px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      font-size: 13.5px;
    }
    .btn-start-now:hover { background: #c2410c; }

    /* ================= GIAI ĐOẠN 2: SÂN KHẤU BIỂU DIỄN ================= */
    .stage-modal {
      width: 580px;
      background: #252830;
      border: 3px solid #64748b;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.9);
      display: none;
    }
    .stage-top-bar {
      background: #0284c7;
      padding: 8px 12px;
      color: #ffffff;
      font-size: 13.5px;
      font-weight: bold;
      text-align: center;
      letter-spacing: -0.3px;
      border-bottom: 2px solid #0369a1;
    }
    .stage-viewport {
      width: 100%;
      height: 220px;
      background: #f1f5f9;
      position: relative;
      overflow: hidden;
      border-bottom: 3px solid #1e242d;
    }

    /* Rèm nhung đỏ hai bên sân khấu */
    .curtain-left, .curtain-right {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 55px;
      z-index: 10;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }
    .curtain-left {
      left: 0;
      background: repeating-linear-gradient(90deg, #991b1b, #b91c1c 12px, #7f1d1d 24px);
      border-right: 2px solid #450a0a;
    }
    .curtain-right {
      right: 0;
      background: repeating-linear-gradient(90deg, #7f1d1d, #b91c1c 12px, #991b1b 24px);
      border-left: 2px solid #450a0a;
    }
    .stage-floor-board {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 35px;
      background: #cbd5e1;
      border-top: 2px solid #94a3b8;
    }

    /* Khối nấm Violetta */
    .v-slot {
      position: absolute;
      bottom: 22px;
      width: 90px;
      height: 110px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      transition: transform 0.22s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 5;
    }
    .down-arrow-tag {
      position: absolute;
      top: -24px;
      font-size: 26px;
      color: #ef4444;
      animation: bounce 0.5s infinite alternate;
      display: none;
    }
    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-8px); }
    }

    /* 4 nút bấm số 1, 2, 3, 4 */
    .stage-btn-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 14px 20px 16px;
      background: #1b1d24;
    }
    .choice-btn {
      height: 44px;
      background: linear-gradient(180deg, #475569 0%, #334155 100%);
      color: #94a3b8;
      border: 1px solid #1e293b;
      border-radius: 6px;
      font-size: 18px;
      font-weight: 800;
      cursor: not-allowed;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
    }
    .choice-btn.active {
      background: linear-gradient(180deg, #64748b 0%, #475569 100%);
      color: #ffffff;
      border-color: #64748b;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .choice-btn.active:hover {
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
      border-color: #38bdf8;
    }

    /* Bảng trạng thái */
    .status-toast {
      margin-top: 15px;
      padding: 6px 18px;
      border-radius: 20px;
      background: rgba(0,0,0,0.7);
      font-weight: bold;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- 1. CỬA SỔ POP-UP CẢNH BÁO (Ảnh 1) -->
  <div class="notice-modal" id="noticeModal">
    <div class="notice-header">
      <span class="notice-timer-num" id="noticeCount">14</span>
      <span>초 후 거짓말 탐지 미니게임이 시작됩니다</span>
    </div>
    <div class="notice-body">
      <div class="notice-blue-box">
        • <span class="highlight">아름답게 화장한 비올레타</span>를 찾아주세요<br>
        • 정답에 따라 테스트 통과 / 실패하게 됩니다
      </div>
      <div class="notice-dialog-box">
        <div class="notice-dialog-text">
          답을 입력하지 않으면<br>
          거짓말 <span class="warn">탐지 테스트</span>에<br>
          실패하니 주의해주세요!
        </div>
        <!-- Avatar Violetta góc dưới -->
        <div id="violettaAvatar" style="width: 70px; height: 70px;"></div>
      </div>
      <button class="btn-start-now" onclick="startStageGame()">Bắt đầu ngay (시작)</button>
    </div>
  </div>

  <!-- 2. SÂN KHẤU TRÁO VỊ TRÍ (Ảnh 2) -->
  <div class="stage-modal" id="stageModal">
    <div class="stage-top-bar" id="stageStatusText">
      화장한 비올레타를 놓치지 말고 주목해주세요.
    </div>
    <div class="stage-viewport">
      <div class="curtain-left"></div>
      <div class="curtain-right"></div>
      <div class="stage-floor-board"></div>

      <!-- 4 Slot nấm -->
      <div class="v-slot" id="slot0"><div class="down-arrow-tag" id="arrow0">▼</div><div class="v-sprite" id="sprite0"></div></div>
      <div class="v-slot" id="slot1"><div class="down-arrow-tag" id="arrow1">▼</div><div class="v-sprite" id="sprite1"></div></div>
      <div class="v-slot" id="slot2"><div class="down-arrow-tag" id="arrow2">▼</div><div class="v-sprite" id="sprite2"></div></div>
      <div class="v-slot" id="slot3"><div class="down-arrow-tag" id="arrow3">▼</div><div class="v-sprite" id="sprite3"></div></div>
    </div>

    <!-- 4 Nút bấm lựa chọn -->
    <div class="stage-btn-grid">
      <button class="choice-btn" id="btn0" onclick="makeChoice(0)">1</button>
      <button class="choice-btn" id="btn1" onclick="makeChoice(1)">2</button>
      <button class="choice-btn" id="btn2" onclick="makeChoice(2)">3</button>
      <button class="choice-btn" id="btn3" onclick="makeChoice(3)">4</button>
    </div>
  </div>

  <div class="status-toast" id="statsBar">Đúng: 0 | Sai: 0</div>

  <script>
    // Hàm dựng hình ảnh vector chi tiết của Violetta
    function renderViolettaSVG(isMakeup, isClosedEyes) {
      const eyeDetails = isClosedEyes
        ? `<path d="M 24 38 Q 28 42 32 38" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round"/>
           <path d="M 44 38 Q 48 42 52 38" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round"/>`
        : (isMakeup
            ? `<!-- Mắt trang điểm có mi cong & má hồng phấn -->
               <ellipse cx="28" cy="36" rx="4.5" ry="5.5" fill="#1e1e24"/>
               <circle cx="27" cy="34" r="1.8" fill="#fff"/>
               <path d="M 23 32 Q 25 29 27 30" stroke="#000" stroke-width="2" fill="none"/>
               <path d="M 26 29 Q 29 27 31 29" stroke="#000" stroke-width="2" fill="none"/>
               <ellipse cx="23" cy="40" rx="4" ry="2" fill="#fb7185" opacity="0.8"/>
               
               <ellipse cx="48" cy="36" rx="4.5" ry="5.5" fill="#1e1e24"/>
               <circle cx="47" cy="34" r="1.8" fill="#fff"/>
               <path d="M 53 32 Q 51 29 49 30" stroke="#000" stroke-width="2" fill="none"/>
               <path d="M 50 29 Q 47 27 45 29" stroke="#000" stroke-width="2" fill="none"/>
               <ellipse cx="53" cy="40" rx="4" ry="2" fill="#fb7185" opacity="0.8"/>`
            : `<!-- Mắt thường -->
               <ellipse cx="28" cy="37" rx="3.5" ry="4" fill="#333"/>
               <circle cx="27" cy="35" r="1.2" fill="#fff"/>
               <ellipse cx="48" cy="37" rx="3.5" ry="4" fill="#333"/>
               <circle cx="47" cy="35" r="1.2" fill="#fff"/>`);

      return `
        <svg width="76" height="85" viewBox="0 0 76 85">
          <!-- Vương miện vàng bên góc -->
          <path d="M 46 8 L 52 2 L 56 9 L 62 4 L 63 15 Z" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
          
          <!-- Mũ nấm hồng chấm trắng -->
          <ellipse cx="38" cy="26" rx="36" ry="24" fill="#f43f5e" stroke="#be123c" stroke-width="2"/>
          <ellipse cx="20" cy="18" rx="7" ry="5" fill="#fff" opacity="0.9"/>
          <ellipse cx="56" cy="18" rx="6" ry="4.5" fill="#fff" opacity="0.9"/>
          <ellipse cx="38" cy="12" rx="5" ry="3.5" fill="#fff" opacity="0.9"/>
          <ellipse cx="38" cy="27" rx="6" ry="4" fill="#fff" opacity="0.9"/>

          <!-- Thân & Khuôn mặt nấm -->
          <path d="M 16 32 C 16 52, 60 52, 60 32 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
          
          <!-- Miệng chúm chím -->
          <path d="M 36 43 Q 38 45 40 43" stroke="#e11d48" stroke-width="2" fill="none" stroke-linecap="round"/>

          <!-- Mắt & Trang điểm -->
          ${eyeDetails}
        </svg>
      `;
    }

    // Render avatar ở màn hình 1
    document.getElementById('violettaAvatar').innerHTML = renderViolettaSVG(true, false);

    let noticeTimer = 14;
    let noticeInterval = null;
    let targetIndex = 0; // Con nào được trang điểm (0 - 3)
    let positions = [0, 1, 2, 3]; // Lưu vị trí tọa độ hiện thời
    let scoreCount = 0, failCount = 0;
    const X_SLOTS = [70, 190, 310, 430]; // 4 vị trí trên sân khấu (px)

    function startNoticeCountdown() {
      clearInterval(noticeInterval);
      noticeTimer = 14;
      document.getElementById('noticeCount').textContent = noticeTimer;
      noticeInterval = setInterval(() => {
        noticeTimer--;
        document.getElementById('noticeCount').textContent = noticeTimer;
        if (noticeTimer <= 0) {
          clearInterval(noticeInterval);
          startStageGame();
        }
      }, 1000);
    }

    function startStageGame() {
      clearInterval(noticeInterval);
      document.getElementById('noticeModal').style.display = 'none';
      document.getElementById('stageModal').style.display = 'block';

      // Khóa nút bấm
      for (let i = 0; i < 4; i++) {
        document.getElementById(`btn${i}`).classList.remove('active');
        document.getElementById(`arrow${i}`).style.display = 'none';
      }

      // Chọn ngẫu nhiên con nấm trang điểm
      targetIndex = Math.floor(Math.random() * 4);
      positions = [0, 1, 2, 3];

      // Đặt vị trí ban đầu
      for (let i = 0; i < 4; i++) {
        const slot = document.getElementById(`slot${i}`);
        slot.style.transform = `translateX(${X_SLOTS[i]}px)`;
        // Vẽ nấm mở mắt (con target có trang điểm)
        document.getElementById(`sprite${i}`).innerHTML = renderViolettaSVG(i === targetIndex, false);
      }

      // Bật mũi tên đỏ chỉ vào con trang điểm
      document.getElementById(`arrow${targetIndex}`).style.display = 'block';
      document.getElementById('stageStatusText').textContent = "화장한 비올레타를 놓치지 말고 주목해주세요!";

      // Sau 2 giây: Nhắm mắt và bắt đầu tráo bài
      setTimeout(() => {
        document.getElementById(`arrow${targetIndex}`).style.display = 'none';
        document.getElementById('stageStatusText').textContent = "눈을 감고 이동하기 시작합니다... (Đang tráo đổi vị trí)";

        // Cả 4 con nhắm mắt lại
        for (let i = 0; i < 4; i++) {
          document.getElementById(`sprite${i}`).innerHTML = renderViolettaSVG(i === targetIndex, true);
        }

        // Bắt đầu tráo vị trí 9 lần
        let swapSteps = 0;
        const shuffleInterval = setInterval(() => {
          let a = Math.floor(Math.random() * 4);
          let b = Math.floor(Math.random() * 4);
          while (b === a) b = Math.floor(Math.random() * 4);

          // Hoán đổi vị trí
          let temp = positions[a];
          positions[a] = positions[b];
          positions[b] = temp;

          document.getElementById(`slot${positions[a]}`).style.transform = `translateX(${X_SLOTS[a]}px)`;
          document.getElementById(`slot${positions[b]}`).style.transform = `translateX(${X_SLOTS[b]}px)`;

          swapSteps++;
          if (swapSteps >= 9) {
            clearInterval(shuffleInterval);
            // Mở khóa các nút 1, 2, 3, 4
            document.getElementById('stageStatusText').textContent = "화장한 비올레타가 위치한 번호를 누르세요! (Hãy chọn vị trí)";
            for (let i = 0; i < 4; i++) {
              document.getElementById(`btn${i}`).classList.add('active');
            }
          }
        }, 280);
      }, 2000);
    }

    function makeChoice(chosenSlot) {
      if (!document.getElementById('btn0').classList.contains('active')) return;

      // Khóa nút
      for (let i = 0; i < 4; i++) {
        document.getElementById(`btn${i}`).classList.remove('active');
        // Mở mắt toàn bộ để kiểm tra
        document.getElementById(`sprite${i}`).innerHTML = renderViolettaSVG(i === targetIndex, false);
      }

      // Con mục tiêu hiện đang nằm ở slot nào
      const correctSlot = positions.indexOf(targetIndex);

      if (chosenSlot === correctSlot) {
        scoreCount++;
        document.getElementById('stageStatusText').textContent = "★ 통과 (Chính xác! Bạn đã tìm đúng Violetta)";
      } else {
        failCount++;
        document.getElementById('stageStatusText').textContent = `✖ 실패 (Sai rồi! Violetta nằm ở vị trí số ${correctSlot + 1})`;
      }

      document.getElementById('statsBar').textContent = `Đúng: ${scoreCount} | Sai: ${failCount}`;

      // 2 giây sau quay lại màn hình cảnh báo lượt mới
      setTimeout(() => {
        document.getElementById('stageModal').style.display = 'none';
        document.getElementById('noticeModal').style.display = 'block';
        startNoticeCountdown();
      }, 2200);
    }

    // Bắt đầu
    startNoticeCountdown();
  </script>
</body>
</html>

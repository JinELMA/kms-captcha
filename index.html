<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MapleStory Worlds - 메이플 운영자 GM Check</title>
  <style>
    * { box-sizing: border-box; user-select: none; font-family: "Malgun Gothic", Dotum, sans-serif; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(rgba(10, 18, 30, 0.45), rgba(10, 18, 30, 0.65)),
                  url('bg.jpg.jpg'), url('bg.jpg'),
                  url('https://images.alphacoders.com/279/279287.jpg') center/cover no-repeat fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      padding: 15px;
    }

    /* ================= KHUNG ĐỒNG HỒ GỖ ĐẾM NGƯỢC ================= */
    .gm-timer-wood-bar {
      width: 620px;
      background: linear-gradient(180deg, #4a2f13 0%, #2f1d0a 100%);
      border: 3px solid #1a0f05;
      border-radius: 8px 8px 0 0;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .gm-timer-title {
      color: #fed7aa;
      font-size: 14px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .gm-timer-wood-display {
      background: #000000;
      border: 2px solid #5c3b1e;
      border-radius: 4px;
      padding: 2px 14px;
      font-family: 'Consolas', monospace;
      font-size: 26px;
      font-weight: 900;
      color: #fde047;
      letter-spacing: 2px;
      text-shadow: 0 0 8px rgba(253, 224, 71, 0.6);
    }

    /* ================= CỬA SỔ HỘP THOẠI NPC CHUẨN GAME ================= */
    .gm-dialog-window {
      width: 620px;
      background: #f1f5f9;
      border: 3px solid #64748b;
      border-top: none;
      border-radius: 0 0 10px 10px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.95);
      color: #1e293b;
      overflow: hidden;
    }

    .gm-dialog-body {
      display: flex;
      padding: 20px 18px 16px;
      gap: 16px;
      background: #ffffff;
    }

    /* Khung NPC bên trái */
    .gm-npc-column {
      width: 130px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border-right: 1.5px solid #cbd5e1;
      padding-right: 14px;
      flex-shrink: 0;
    }
    .gm-avatar-box {
      width: 90px;
      height: 105px;
      background: #e2e8f0;
      border: 2px solid #94a3b8;
      border-radius: 8px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 6px rgba(0,0,0,0.1);
    }
    .gm-name-badge {
      background: #1e293b;
      color: #ffffff;
      font-size: 11.5px;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 4px;
      text-align: center;
      width: 100%;
      letter-spacing: -0.3px;
    }

    /* Khung nội dung câu hỏi bên phải */
    .gm-content-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 180px;
    }
    .gm-question-box {
      font-size: 13.5px;
      line-height: 1.6;
      color: #0f172a;
      font-weight: 600;
    }

    /* Kiểu chữ xếp dọc chống bot */
    .vertical-grid-text {
      display: flex;
      gap: 18px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 2px;
      line-height: 1.6;
      padding: 8px 12px;
      background: #f8fafc;
      border: 1px dashed #94a3b8;
      border-radius: 6px;
      color: #0f172a;
    }
    .vert-col {
      display: flex;
      flex-direction: column;
      text-align: center;
    }

    /* Ô gõ phím */
    .gm-input-wrapper {
      margin-top: 14px;
    }
    .gm-text-input {
      width: 100%;
      height: 38px;
      background: #ffffff;
      border: 2px solid #334155;
      border-radius: 4px;
      padding: 6px 12px;
      font-size: 14.5px;
      font-weight: bold;
      color: #0f172a;
      outline: none;
    }
    .gm-text-input:focus { border-color: #ea580c; }

    /* Thanh chân trang kèm nút bấm Xác nhận */
    .gm-footer-bar {
      background: #cbd5e1;
      border-top: 1.5px solid #94a3b8;
      padding: 8px 16px;
      display: flex;
      justify-content: flex-end;
    }
    .gm-btn-confirm {
      padding: 6px 28px;
      background: linear-gradient(180deg, #f97316 0%, #ea580c 100%);
      border: 1px solid #c2410c;
      border-radius: 4px;
      color: #ffffff;
      font-weight: 900;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .gm-btn-confirm:hover { background: #c2410c; }

    /* ================= BẢNG HƯỚNG DẪN GIẢI CHO NHÂN VIÊN ================= */
    .staff-guide-card {
      width: 620px;
      margin-top: 14px;
      background: rgba(15, 23, 42, 0.95);
      border: 1.5px solid #38bdf8;
      border-radius: 8px;
      padding: 12px 16px;
      color: #cbd5e1;
    }
    .staff-guide-title {
      font-size: 13.5px;
      font-weight: 800;
      color: #facc15;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .staff-guide-content {
      font-size: 12.5px;
      line-height: 1.6;
    }
    .staff-guide-content b { color: #38bdf8; }
    .staff-guide-sample {
      background: #0f172a;
      border: 1px dashed #475569;
      border-radius: 4px;
      padding: 6px 10px;
      margin-top: 6px;
      font-family: 'Consolas', monospace;
      color: #4ade80;
      font-size: 13px;
      font-weight: bold;
    }

    .score-toast {
      margin-top: 14px;
      padding: 8px 24px;
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.85);
      font-weight: 700;
      font-size: 14.5px;
      border: 1px solid #475569;
    }
    .score-toast b { color: #facc15; }
  </style>
</head>
<body>

  <!-- ĐỒNG HỒ GỖ ĐẾM NGƯỢC -->
  <div class="gm-timer-wood-bar">
    <span class="gm-timer-title">● 남은시간</span>
    <div class="gm-timer-wood-display">
      00 : <span id="gmSecondsDisplay">45</span>
    </div>
  </div>

  <!-- CỬA SỔ HỘP THOẠI GM -->
  <div class="gm-dialog-window">
    <div class="gm-dialog-body">
      <!-- Cột NPC Quản lý game bên trái -->
      <div class="gm-npc-column">
        <div class="gm-avatar-box" id="gmAvatarSVG"></div>
        <div class="gm-name-badge">메이플 운영자</div>
      </div>

      <!-- Cột câu hỏi & ô nhập bên phải -->
      <div class="gm-content-column">
        <div class="gm-question-box" id="gmQuestionArea">Đang tải câu hỏi kiểm tra...</div>
        <div class="gm-input-wrapper">
          <input type="text" class="gm-text-input" id="gmInputField" placeholder="Nhập câu trả lời theo yêu cầu..." autocomplete="off">
        </div>
      </div>
    </div>

    <!-- Nút bấm Xác nhận -->
    <div class="gm-footer-bar">
      <button class="gm-btn-confirm" onclick="submitGMResponse()">확인</button>
    </div>
  </div>

  <!-- BẢNG HƯỚNG DẪN GIẢI DÀNH CHO NHÂN VIÊN -->
  <div class="staff-guide-card">
    <div class="staff-guide-title">📖 HƯỚNG DẪN & ĐÁP ÁN MẪU CHO NHÂN VIÊN</div>
    <div class="staff-guide-content" id="staffExplanationText">Đang tải hướng dẫn...</div>
    <div class="staff-guide-sample" id="staffSampleAnswer">Gợi ý câu trả lời mẫu: ...</div>
  </div>

  <div class="score-toast" id="scoreBar">Đúng: <b>0</b> | Chuỗi liên tiếp: <b>0</b></div>

  <script>
    // Hàm vẽ chi tiết nhân vật Quản lý game (메이플 운영자 - Mũ trắng chữ W, áo vest, cặp táp)
    function renderGMAvatarSVG() {
      return `
        <svg width="84" height="96" viewBox="0 0 84 96">
          <!-- Áo vest xanh xám -->
          <path d="M 22 56 L 36 84 L 48 84 L 62 56 Z" fill="#334155" stroke="#1e293b" stroke-width="2"/>
          <path d="M 37 56 L 42 66 L 47 56 Z" fill="#ffffff"/>
          <rect x="40" y="66" width="4" height="12" fill="#ef4444"/>

          <!-- Tay & Túi xách nâu -->
          <rect x="58" y="70" width="16" height="18" rx="3" fill="#78350f" stroke="#451a03" stroke-width="2"/>
          <path d="M 62 70 Q 66 64 70 70" stroke="#451a03" stroke-width="2" fill="none"/>

          <!-- Khuôn mặt -->
          <circle cx="42" cy="42" r="18" fill="#ffedd5" stroke="#ca8a04" stroke-width="1.5"/>
          <circle cx="36" cy="42" r="2.2" fill="#1e293b"/>
          <circle cx="48" cy="42" r="2.2" fill="#1e293b"/>
          <path d="M 40 48 Q 42 50 44 48" stroke="#ef4444" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <ellipse cx="32" cy="45" rx="3" ry="1.5" fill="#f87171" opacity="0.6"/>
          <ellipse cx="52" cy="45" rx="3" ry="1.5" fill="#f87171" opacity="0.6"/>

          <!-- Tóc đen lãng tử -->
          <path d="M 24 38 C 24 24, 60 24, 60 38 C 55 32, 28 32, 24 38 Z" fill="#1e293b"/>

          <!-- Mũ thuyền trưởng trắng có chữ W xanh biển -->
          <path d="M 18 30 C 18 12, 66 12, 66 30 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
          <path d="M 16 30 Q 42 33 68 30" stroke="#0284c7" stroke-width="4" fill="none"/>
          <!-- Chữ W trên mũ -->
          <path d="M 36 20 L 39 26 L 42 21 L 45 26 L 48 20" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
      `;
    }
    document.getElementById('gmAvatarSVG').innerHTML = renderGMAvatarSVG();

    // 5 MẪU CÂU HỎI THỰC TẾ ĐƯỢC BÓC TÁCH TỪ ẢNH MAPLE PLANET
    const GM_QUESTION_BANK = [
      // Dạng 1: Chữ xếp dọc chống bot (Ảnh 3)
      {
        id: "VERT_TEXT",
        renderHTML: () => `
          <div style="margin-bottom: 8px; font-weight: bold; color: #b91c1c;">[보안 문자 확인] 아래 글자를 세로로 읽고 사냥터 이름을 입력하세요:</div>
          <div class="vertical-grid-text">
            <div class="vert-col"><span>현</span><span>재</span></div>
            <div class="vert-col"><span>사</span><span>냥</span><span>터</span><span>의</span></div>
            <div class="vert-col"><span>이</span><span>름</span><span>을</span><span>입</span><span>력</span><span>해</span><span>주</span><span>세</span></div>
            <div class="vert-col"><span>요</span></div>
          </div>
        `,
        explain: "Câu hỏi xếp theo 4 cột dọc chống đọc tự động: <b>현재 사냥터의 이름을 입력해 주세요</b> (Hãy nhập tên bãi săn hiện tại). Nhân viên chỉ cần gõ tên map bất kỳ hoặc tên bãi săn đang đứng.",
        sample: "bãi săn mẫu: 헤네시스 (Henesys) hoặc 개미굴 (Ant Tunnel)",
        validate: (input) => input.trim().length >= 2 && /^[가-힣]+$/.test(input.replace(/\s+/g, ''))
      },

      // Dạng 2: Tổ hợp 3 câu hỏi ngăn cách dấu / (Ảnh 2 & 4)
      {
        id: "TRIPLE_SLASH",
        renderHTML: () => `
          <b>[알림]</b> 아래의 3가지 문제를 풀어주세요.<br><br>
          <b>[1번문제]</b> 우리나라의 국가명은?<br>
          <b>[2번문제]</b> 생각나는 보스 몬스터 이름은?<br>
          <b>[3번문제]</b> 현재 접속중인 내 캐릭터의 이름은?<br><br>
          <span style="color:#2563eb;">위 문제의 답을 제한 시간 내에 정확하게 입력해 주세요.</span><br>
          <span style="color:#dc2626; font-weight:bold;">답변 예시 : 대한민국 / 자쿰 / 홍길동</span>
        `,
        explain: "Yêu cầu trả lời đúng 3 phần ngăn cách bởi dấu gạch chéo <b>/</b>:<br>1. Tên quốc gia (대한민국 hoặc 한국)<br>2. Tên 1 con Boss (자쿰, 혼테일, 핑크빈...)<br>3. Tên nhân vật đang chơi.",
        sample: "대한민국 / 자쿰 / 진안대군파보",
        validate: (input) => {
          const parts = input.split('/');
          return parts.length === 3 && parts.every(p => p.trim().length > 0);
        }
      },

      // Dạng 3: 10 chữ Hangul ngẫu nhiên không trùng (Ảnh 6)
      {
        id: "TEN_UNIQUE_HANGUL",
        renderHTML: () => `
          <b style="color:#b91c1c;">[ 요청 사항 ]</b><br>
          서로 다른 한글 10글자를 임의로 입력해 주세요.<br><br>
          <b>[ 규칙 안내 ]</b><br>
          <span style="color:#64748b;">
          ※ 같은 글자 반복 및 가나다라 순차 입력은 제외<br>
          ※ 자음/모음 단독 입력 및 같은 모음 반복 입력은 제외<br>
          ※ 숫자, 영문, 공백, 특수문자는 제외
          </span>
        `,
        explain: "Yêu cầu gõ đúng <b>10 chữ Hangul khác nhau</b>. Tuyệt đối không có khoảng trắng, không số, không lặp chữ.",
        sample: "동서남북갑을병정무기 (gõ phím QWERTY: ehdtjsskabrkfdmfqudwjdanrl)",
        validate: (input) => {
          const clean = input.replace(/\s+/g, '');
          const set = new Set(clean);
          return clean.length >= 10 && set.size >= 10 && /^[가-힣]+$/.test(clean);
        }
      },

      // Dạng 4: Miêu tả bãi săn tự do >= 8 chữ (Ảnh 7)
      {
        id: "HUNT_DESC_EIGHT",
        renderHTML: () => `
          <b style="color:#b91c1c;">[ 요청 사항 ]</b><br>
          현재 사냥터의 풍경을 자유롭게 8글자 이상 적어주세요.<br><br>
          <b>[ 규칙 안내 ]</b><br>
          <span style="color:#64748b;">
          ※ 한글로 입력 → 숫자, 영문, 공백, 특수문자는 제외<br>
          ※ 캐릭터명, 닉네임, 몬스터명 입력은 제외해 주세요.
          </span>
        `,
        explain: "Miêu tả tự do về bãi săn bằng tiếng Hàn từ <b>8 ký tự trở lên</b>. Không chứa khoảng trắng hay ký tự đặc biệt.",
        sample: "나무가많고시원한사냥터 (Khu săn nhiều cây xanh mát mẻ)",
        validate: (input) => {
          const clean = input.replace(/\s+/g, '');
          return clean.length >= 8 && /^[가-힣]+$/.test(clean);
        }
      },

      // Dạng 5: Nhập tên nhân vật và nghề nghiệp (Ảnh 1 & 5)
      {
        id: "NAME_AND_JOB",
        renderHTML: () => `
          <b>안녕하세요. 메이플 플레이어 확인 진행중입니다.</b><br><br>
          현재 화면을 확인하고 조작 중이시라면 아래 요청 사항을 입력하세요.<br><br>
          <b>아래 칸에 자신의 캐릭터 이름과 직업을 입력하세요.</b><br>
          <span style="color:#64748b;">※ 현재 접속중인 캐릭터 이름과 직업입니다.</span>
        `,
        explain: "Yêu cầu nhập tên nhân vật và nhánh nghề nghiệp đang chơi (ví dụ: Pháp sư băng lôi, Cung thủ...).",
        sample: "진안대군파보 썬콜 (hoặc: 홍길동 전사)",
        validate: (input) => input.trim().length >= 4
      }
    ];

    let currentQ = null;
    let timerCount = 45;
    let mainCountdown = null;
    let score = 0, streak = 0;

    const gmSecondsDisplay = document.getElementById('gmSecondsDisplay');
    const gmQuestionArea = document.getElementById('gmQuestionArea');
    const gmInputField = document.getElementById('gmInputField');
    const staffExplanationText = document.getElementById('staffExplanationText');
    const staffSampleAnswer = document.getElementById('staffSampleAnswer');

    function startNewGMQuestion() {
      clearInterval(mainCountdown);
      timerCount = 45;
      gmSecondsDisplay.textContent = timerCount;
      gmInputField.value = '';
      gmInputField.focus();

      // Bốc ngẫu nhiên 1 câu hỏi trong 5 mẫu
      currentQ = GM_QUESTION_BANK[Math.floor(Math.random() * GM_QUESTION_BANK.length)];
      gmQuestionArea.innerHTML = currentQ.renderHTML();
      staffExplanationText.innerHTML = currentQ.explain;
      staffSampleAnswer.textContent = "Gợi ý câu trả lời mẫu: " + currentQ.sample;

      mainCountdown = setInterval(() => {
        timerCount--;
        gmSecondsDisplay.textContent = String(timerCount).padStart(2, '0');

        if (timerCount <= 0) {
          clearInterval(mainCountdown);
          streak = 0;
          alert("✖ 실패 (Hết giờ! Bạn chưa hoàn thành đối thoại GM)");
          updateScoreDisplay();
          startNewGMQuestion();
        }
      }, 1000);
    }

    function submitGMResponse() {
      const userText = gmInputField.value;
      clearInterval(mainCountdown);

      if (currentQ && currentQ.validate(userText)) {
        score++;
        streak++;
        alert("★ 통과 (Chính xác! Đối thoại kiểm tra GM thành công)");
      } else {
        streak = 0;
        alert("✖ 실패 (Câu trả lời không đúng quy tắc hoặc sai định dạng!)");
      }

      updateScoreDisplay();
      startNewGMQuestion();
    }

    function updateScoreDisplay() {
      document.getElementById('scoreBar').innerHTML = `Đúng: <b>${score}</b> | Chuỗi liên tiếp: <b>${streak}</b>`;
    }

    // Hỗ trợ phím Enter để gửi nhanh
    gmInputField.onkeydown = (e) => {
      if (e.key === 'Enter') {
        submitGMResponse();
      }
    };

    startNewGMQuestion();
  </script>
</body>
</html>

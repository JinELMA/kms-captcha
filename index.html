<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MapleStory KMS - 도형 추적 Lie Detector</title>
  <style>
    * { box-sizing: border-box; user-select: none; font-family: "Malgun Gothic", Dotum, sans-serif; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(rgba(10, 18, 30, 0.45), rgba(10, 18, 30, 0.65)),
                  url('bg.jpg.jpg'), url('bg.jpg'),
                  url('https://images.alphacoders.com/279/279287.jpg') center/cover no-repeat fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    /* ================= 1. MÀN HÌNH THÔNG BÁO CHUẨN BỊ (CHUẨN ẢNH 1) ================= */
    .ld-window {
      width: 530px;
      background: #ffffff;
      border: 3px solid #334155;
      border-radius: 8px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
      overflow: hidden;
      display: block;
    }
    .ld-titlebar {
      background: #1e2530;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 800;
      color: #facc15;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #0f172a;
    }
    .ld-body-upper {
      padding: 24px 20px 18px;
      text-align: center;
      background: #ffffff;
      color: #1e293b;
    }
    .ld-main-countdown {
      font-size: 18px;
      font-weight: 800;
      line-height: 1.5;
    }
    .ld-main-countdown .sec-highlight {
      font-size: 26px;
      color: #0284c7;
      font-family: 'Consolas', monospace;
      font-weight: 900;
    }
    .ld-sub-warning {
      margin-top: 6px;
      font-size: 14px;
      color: #64748b;
      font-weight: 600;
    }

    .ld-body-lower {
      background: #e2e8f0;
      border-top: 1px solid #cbd5e1;
      padding: 16px 20px;
      text-align: center;
      color: #334155;
    }
    .ld-instructions {
      font-size: 13px;
      line-height: 1.6;
      font-weight: 600;
      margin-bottom: 14px;
    }

    /* 3 Ô xem trước quá trình mờ dần */
    .preview-steps-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .preview-card {
      width: 95px;
      height: 95px;
      background: radial-gradient(circle, #eab308 15%, #b45309 90%);
      border: 2px solid #78350f;
      border-radius: 6px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.4);
    }
    .preview-target-icon {
      position: absolute;
      bottom: 8px;
      right: 8px;
      width: 28px;
      height: 28px;
    }
    .preview-arrow {
      color: #94a3b8;
      font-size: 18px;
      font-weight: 900;
    }

    .btn-start-track {
      padding: 9px 34px;
      background: linear-gradient(180deg, #f97316 0%, #ea580c 100%);
      border: 1px solid #c2410c;
      border-radius: 4px;
      color: #ffffff;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(234, 88, 12, 0.4);
    }
    .btn-start-track:hover { background: #c2410c; }

    /* ================= 2. SÂN CHƠI BÁM ĐUỔI THỰC CHIẾN (CHUẨN ẢNH 2) ================= */
    .game-window {
      width: 650px;
      background: #1e2430;
      border: 3px solid #475569;
      border-radius: 10px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.95);
      overflow: hidden;
      display: none;
    }

    /* Nền ngụy trang mật ong/caramel honeycomb lồi lõm */
    .camo-arena {
      width: 100%;
      height: 380px;
      background-color: #b87a14;
      background-image: 
        radial-gradient(circle at 20% 30%, #fcd34d 0%, #d97706 35%, transparent 60%),
        radial-gradient(circle at 75% 25%, #fbbf24 0%, #b45309 40%, transparent 65%),
        radial-gradient(circle at 40% 70%, #fde68a 0%, #92400e 45%, transparent 60%),
        radial-gradient(circle at 85% 75%, #f59e0b 0%, #78350f 45%, transparent 65%),
        radial-gradient(circle at 50% 40%, #b45309 10%, #78350f 70%);
      background-size: 160px 160px;
      position: relative;
      overflow: hidden;
      cursor: crosshair;
    }

    /* Vòng tròn bong bóng ngụy trang gây nhiễu */
    .camo-bubble {
      position: absolute;
      border: 3px solid rgba(254, 240, 138, 0.45);
      border-radius: 50%;
      box-shadow: inset 0 0 14px rgba(69, 26, 3, 0.6), 0 4px 8px rgba(0,0,0,0.3);
      pointer-events: none;
    }

    /* Mục tiêu tròn trắng chứa tâm ngắm xanh lá */
    .tracking-orb {
      position: absolute;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s;
      z-index: 20;
    }

    /* Số đếm cyan trên đầu mục tiêu */
    .floating-timer-cyan {
      position: absolute;
      top: -38px;
      font-family: 'Consolas', monospace;
      font-size: 34px;
      font-weight: 900;
      color: #67e8f9;
      text-shadow: 0 0 8px #0891b2, 0 2px 4px #000;
      pointer-events: none;
    }

    /* Dòng phụ đề game góc dưới */
    .bottom-game-prompt {
      position: absolute;
      bottom: 12px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 15px;
      font-weight: 900;
      color: #fef08a;
      text-shadow: 0 2px 4px #000, 0 0 6px #b45309;
      letter-spacing: -0.3px;
      pointer-events: none;
      z-index: 30;
    }

    /* Thanh tiến trình tích lũy thời gian giữ chuột */
    .progress-track-wrapper {
      background: #111827;
      padding: 12px 20px 14px;
      border-top: 2px solid #334155;
    }
    .progress-bar-bg {
      width: 100%;
      height: 18px;
      background: #1e293b;
      border-radius: 9px;
      overflow: hidden;
      border: 1px solid #475569;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
    }
    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #22c55e 0%, #4ade80 100%);
      box-shadow: 0 0 10px #22c55e;
      transition: width 0.08s linear;
    }

    .score-banner {
      margin-top: 16px;
      padding: 8px 24px;
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.85);
      font-weight: 700;
      font-size: 15px;
      border: 1px solid #475569;
    }
    .score-banner b { color: #facc15; }
  </style>
</head>
<body>

  <!-- 1. POP-UP THÔNG BÁO CHUẨN BỊ (Chuẩn ảnh 1) -->
  <div class="ld-window" id="noticeWindow">
    <div class="ld-titlebar">
      <span>LIE DETECTOR :</span>
    </div>
    <div class="ld-body-upper">
      <div class="ld-main-countdown">
        <span class="sec-highlight" id="prepTimer">8</span>초 후 거짓말 탐지 미니게임이 시작됩니다.
      </div>
      <div class="ld-sub-warning">
        게임이 시작되기 전에 안전한 곳으로 이동해 주세요
      </div>
    </div>
    <div class="ld-body-lower">
      <div class="ld-instructions">
        점점 투명해지면서 움직이는 도형 위에<br>
        마우스 커서가 위치하도록 마우스를 움직여주세요.<br><br>
        마우스 커서가 도형에 위치한 시간에 따라<br>
        통과/실패가 결정됩니다
      </div>

      <!-- 3 Ảnh xem trước quá trình tàng hình -->
      <div class="preview-steps-row">
        <!-- Bước 1: Trắng rõ -->
        <div class="preview-card">
          <svg width="60" height="60" viewBox="0 0 60 60">
            <path d="M 30 5 L 37 20 L 53 23 L 42 34 L 44 50 L 30 42 L 16 50 L 18 34 L 7 23 L 23 20 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
          </svg>
          <div class="preview-target-icon" id="reticleP1"></div>
        </div>

        <div class="preview-arrow">▶</div>

        <!-- Bước 2: Bán trong suốt -->
        <div class="preview-card">
          <svg width="60" height="60" viewBox="0 0 60 60" style="opacity: 0.5;">
            <path d="M 30 5 L 37 20 L 53 23 L 42 34 L 44 50 L 30 42 L 16 50 L 18 34 L 7 23 L 23 20 Z" fill="#ffffff"/>
          </svg>
          <div class="preview-target-icon" id="reticleP2"></div>
        </div>

        <div class="preview-arrow">▶</div>

        <!-- Bước 3: Gần như tàng hình -->
        <div class="preview-card">
          <svg width="60" height="60" viewBox="0 0 60 60" style="opacity: 0.15;">
            <path d="M 30 5 L 37 20 L 53 23 L 42 34 L 44 50 L 30 42 L 16 50 L 18 34 L 7 23 L 23 20 Z" fill="#ffffff"/>
          </svg>
          <div class="preview-target-icon" id="reticleP3"></div>
        </div>
      </div>

      <button class="btn-start-track" onclick="startTrackingGame()">바로 시작 (Bắt đầu ngay)</button>
    </div>
  </div>

  <!-- 2. SÂN CHƠI BÁM ĐUỔI THỰC CHIẾN (Chuẩn ảnh 2) -->
  <div class="game-window" id="gameWindow">
    <div class="ld-titlebar">
      <span>LIE DETECTOR :</span>
    </div>
    
    <div class="camo-arena" id="camoArena">
      <!-- Bong bóng ngụy trang -->
      <div class="camo-bubble" style="width: 90px; height: 90px; top: 30px; left: 60px;"></div>
      <div class="camo-bubble" style="width: 120px; height: 120px; top: 180px; left: 70px;"></div>
      <div class="camo-bubble" style="width: 110px; height: 110px; top: 40px; right: 80px;"></div>
      <div class="camo-bubble" style="width: 140px; height: 140px; bottom: 30px; right: 100px;"></div>
      <div class="camo-bubble" style="width: 80px; height: 80px; top: 150px; left: 320px;"></div>

      <!-- Mục tiêu bám đuổi -->
      <div class="tracking-orb" id="trackingOrb">
        <div class="floating-timer-cyan" id="floatingTimer">7</div>
        <div id="orbReticle" style="width: 38px; height: 38px;"></div>
      </div>

      <div class="bottom-game-prompt">
        카운트다운 종료 후, 움직이는 도형에 커서를 올려두세요
      </div>
    </div>

    <!-- Thanh tiến trình giữ chuột -->
    <div class="progress-track-wrapper">
      <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: bold; margin-bottom: 6px; color: #cbd5e1;">
        <span>목표 유지 게이지 (Tiến trình bám đuổi)</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
    </div>
  </div>

  <div class="score-banner" id="scoreBanner">Đúng: <b>0</b> | Chuỗi liên tiếp: <b>0</b></div>

  <script>
    // Hàm tạo biểu tượng tâm ngắm xanh lá chuẩn xác (Green reticle crosshair)
    function getGreenReticleSVG() {
      return `
        <svg width="100%" height="100%" viewBox="0 0 36 36">
          <circle cx="18" cy="18" r="14" fill="none" stroke="#15803d" stroke-width="2.5"/>
          <circle cx="18" cy="18" r="7" fill="none" stroke="#16a34a" stroke-width="2"/>
          <line x1="18" y1="2" x2="18" y2="10" stroke="#15803d" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="18" y1="26" x2="18" y2="34" stroke="#15803d" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="2" y1="18" x2="10" y2="18" stroke="#15803d" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="26" y1="18" x2="34" y2="18" stroke="#15803d" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="18" cy="18" r="2.5" fill="#22c55e"/>
        </svg>
      `;
    }

    // Nhúng tâm ngắm vào 3 ô preview
    document.getElementById('reticleP1').innerHTML = getGreenReticleSVG();
    document.getElementById('reticleP2').innerHTML = getGreenReticleSVG();
    document.getElementById('reticleP3').innerHTML = getGreenReticleSVG();
    document.getElementById('orbReticle').innerHTML = getGreenReticleSVG();

    let prepSec = 8;
    let prepInterval = null;
    let gameLoop = null;

    let score = 0, streak = 0;
    let progress = 0;
    let isCursorOverTarget = false;

    // Tọa độ và vận tốc của mục tiêu
    let posX = 260, posY = 140;
    let velX = 2.4, velY = 2.0;
    let remainingGameSec = 7;

    function startPrepCountdown() {
      clearInterval(prepInterval);
      prepSec = 8;
      document.getElementById('prepTimer').textContent = prepSec;
      prepInterval = setInterval(() => {
        prepSec--;
        document.getElementById('prepTimer').textContent = prepSec;
        if (prepSec <= 0) {
          clearInterval(prepInterval);
          startTrackingGame();
        }
      }, 1000);
    }

    function startTrackingGame() {
      clearInterval(prepInterval);
      document.getElementById('noticeWindow').style.display = 'none';
      document.getElementById('gameWindow').style.display = 'block';

      // Khởi tạo thông số
      progress = 0;
      isCursorOverTarget = false;
      remainingGameSec = 7;
      document.getElementById('progressFill').style.width = '0%';
      document.getElementById('progressPercent').textContent = '0%';
      document.getElementById('floatingTimer').textContent = remainingGameSec;

      const orb = document.getElementById('trackingOrb');
      orb.style.opacity = '1';

      // Lắng nghe sự kiện chuột vào/ra khỏi mục tiêu
      orb.onmouseenter = () => { isCursorOverTarget = true; };
      orb.onmouseleave = () => { isCursorOverTarget = false; };

      // Đặt vị trí ngẫu nhiên ban đầu
      posX = 150 + Math.random() * 300;
      posY = 80 + Math.random() * 180;
      velX = (Math.random() > 0.5 ? 2.4 : -2.4);
      velY = (Math.random() > 0.5 ? 2.0 : -2.0);

      let elapsedTime = 0;

      // Vòng lặp chuyển động & tính điểm
      gameLoop = setInterval(() => {
        elapsedTime += 25;

        // Cập nhật số đếm ngược cyan (mỗi giây)
        if (elapsedTime % 1000 < 25 && remainingGameSec > 0) {
          remainingGameSec--;
          document.getElementById('floatingTimer').textContent = remainingGameSec;
        }

        // Độ mờ tàng hình dần (từ 1.0 xuống 0.15 trong 7 giây)
        const currentOpacity = Math.max(0.15, 1.0 - (elapsedTime / 6500));
        orb.style.opacity = currentOpacity;

        // Di chuyển nảy góc trong khung (kích thước khung: 650 x 380, kích thước orb: 62)
        posX += velX;
        posY += velY;

        if (posX <= 10 || posX >= 578) velX *= -1;
        if (posY <= 10 || posY >= 308) velY *= -1;

        orb.style.left = posX + 'px';
        orb.style.top = posY + 'px';

        // Nếu giữ chuột trúng mục tiêu -> Tăng thanh tiến trình
        if (isCursorOverTarget) {
          progress = Math.min(100, progress + 0.55);
          document.getElementById('progressFill').style.width = progress + '%';
          document.getElementById('progressPercent').textContent = Math.floor(progress) + '%';

          // Đạt 100% -> THÀNH CÔNG
          if (progress >= 100) {
            endGame(true);
          }
        }

        // Hết 7 giây mà chưa đạt 100% -> THẤT BẠI
        if (elapsedTime >= 7000 && progress < 100) {
          endGame(false);
        }
      }, 25);
    }

    function endGame(isSuccess) {
      clearInterval(gameLoop);

      if (isSuccess) {
        score++;
        streak++;
        alert("★ 통과 (Chính xác! Bạn đã bám sát mục tiêu tàng hình thành công)");
      } else {
        streak = 0;
        alert("✖ 실패 (Thất bại! Bạn chưa tích lũy đủ 100% thời gian giữ chuột trên mục tiêu)");
      }

      document.getElementById('scoreBanner').innerHTML = `Đúng: <b>${score}</b> | Chuỗi liên tiếp: <b>${streak}</b>`;

      // Quay lại màn hình thông báo chuẩn bị
      document.getElementById('gameWindow').style.display = 'none';
      document.getElementById('noticeWindow').style.display = 'block';
      startPrepCountdown();
    }

    // Bắt đầu
    startPrepCountdown();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MapleStory KMS - 화장한 비올레타를 찾아라</title>
  <style>
    * { box-sizing: border-box; user-select: none; font-family: "Malgun Gothic", "Dotum", sans-serif; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(rgba(10, 18, 30, 0.45), rgba(10, 18, 30, 0.65)),
                  url('bg.jpg.jpg'), url('bg.jpg'),
                  url('https://images.alphacoders.com/279/279287.jpg') center/cover no-repeat fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    /* ================= 1. CỬA SỔ POP-UP THÔNG BÁO (CHUẨN ẢNH 1) ================= */
    .notice-card {
      width: 440px;
      background: #232731;
      border: 2px solid #5a6475;
      border-radius: 8px;
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.85);
      overflow: hidden;
      display: block;
    }
    .notice-header {
      background: #181a20;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: bold;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 2px solid #353b49;
    }
    .notice-timer-yellow {
      color: #facc15;
      font-size: 22px;
      font-family: 'Consolas', monospace;
      font-weight: 800;
      text-shadow: 0 0 6px rgba(250, 204, 21, 0.5);
    }
    .notice-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .notice-blue-box {
      background: #0284c7;
      border: 1px solid #38bdf8;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.6;
      color: #ffffff;
      font-weight: bold;
    }
    .notice-blue-box .hl {
      color: #fef08a;
    }
    .notice-dialog-box {
      background: #333945;
      border: 1px solid #485263;
      border-radius: 6px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .notice-dialog-text {
      font-size: 12.5px;
      color: #f1f5f9;
      line-height: 1.5;
      font-weight: 600;
    }
    .notice-dialog-text .warn {
      color: #facc15;
    }
    .btn-start-play {
      margin: 6px auto 2px;
      padding: 8px 28px;
      background: #ea580c;
      border: 1px solid #f97316;
      border-radius: 4px;
      color: #ffffff;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.15s;
    }
    .btn-start-play:hover { background: #c2410c; }

    /* ================= 2. SÂN KHẤU RÈM ĐỎ (CHUẨN ẢNH 2) ================= */
    .stage-card {
      width: 580px;
      background: #1c2028;
      border: 3px solid #64748b;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 20px 55px rgba(0, 0, 0, 0.9);
      display: none;
    }
    .stage-top-banner {
      background: #0284c7;
      padding: 8px 14px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      border-bottom: 2px solid #0369a1;
      letter-spacing: -0.3px;
    }
    .stage-area {
      width: 100%;
      height: 230px;
      background: linear-gradient(180deg, #1e2530 0%, #334155 75%, #475569 100%);
      position: relative;
      overflow: hidden;
      border-bottom: 3px solid #14171d;
    }

    /* Rèm nhung đỏ 2 bên */
    .curtain-l, .curtain-r {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 60px;
      z-index: 20;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.6);
    }
    .curtain-l {
      left: 0;
      background: repeating-linear-gradient(90deg, #991b1b, #b91c1c 12px, #7f1d1d 24px);
      border-right: 2px solid #450a0a;
    }
    .curtain-r {
      right: 0;
      background: repeating-linear-gradient(90deg, #7f1d1d, #b91c1c 12px, #991b1b 24px);
      border-left: 2px solid #450a0a;
    }
    .stage-floor-rail {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 42px;
      background: linear-gradient(180deg, #f8fafc 0%, #cbd5e1 100%);
      border-top: 2px solid #94a3b8;
      box-shadow: 0 -2px 6px rgba(0,0,0,0.2);
    }

    /* Vị trí nấm trượt */
    .shroom-lane {
      position: absolute;
      bottom: 22px;
      width: 90px;
      height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      transition: transform 0.8s cubic-bezier(0.45, 0.05, 0.55, 0.95);
      z-index: 10;
    }
    .red-arrow-target {
      position: absolute;
      top: -24px;
      font-size: 28px;
      color: #ef4444;
      animation: bounceArrow 0.45s infinite alternate;
      display: none;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }
    @keyframes bounceArrow {
      from { transform: translateY(0); }
      to { transform: translateY(-7px); }
    }

    /* 4 nút xám 1, 2, 3, 4 ở dưới */
    .stage-buttons-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding: 14px 22px 18px;
      background: #14171e;
    }
    .num-btn {
      height: 46px;
      background: linear-gradient(180deg, #475569 0%, #334155 100%);
      color: #94a3b8;
      border: 1px solid #1e293b;
      border-radius: 6px;
      font-size: 20px;
      font-weight: 900;
      cursor: not-allowed;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.15);
      transition: all 0.15s;
    }
    .num-btn.ready {
      background: linear-gradient(180deg, #64748b 0%, #475569 100%);
      color: #ffffff;
      border-color: #64748b;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .num-btn.ready:hover {
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
      border-color: #38bdf8;
    }

    .score-toast {
      margin-top: 16px;
      padding: 6px 20px;
      border-radius: 20px;
      background: rgba(0,0,0,0.75);
      font-weight: 700;
      font-size: 14.5px;
      border: 1px solid #475569;
    }
    .score-toast b { color: #facc15; }
  </style>
</head>
<body>

  <div class="notice-card" id="noticeModal">
    <div class="notice-header">
      <span class="notice-timer-yellow" id="noticeTimerText">14</span>
      <span>초 후 거짓말 탐지 미니게임이 시작됩니다</span>
    </div>
    <div class="notice-body">
      <div class="notice-blue-box">
        • <span class="hl">아름답게 화장한 비올레타</span>를 찾아주세요<br>
        • 정답에 따라 테스트 통과 / 실패하게 됩니다
      </div>
      <div class="notice-dialog-box">
        <div class="notice-dialog-text">
          답을 입력하지 않으면<br>
          거짓말 <span class="warn">탐지 테스트</span>에<br>
          실패하니 주의해주세요!
        </div>
        <div id="noticeAvatar" style="width: 72px; height: 78px;"></div>
      </div>
      <button class="btn-start-play" onclick="startStageImmediately()">Bắt đầu ngay (시작)</button>
    </div>
  </div>

  <div class="stage-card" id="stageModal">
    <div class="stage-top-banner" id="stageBannerText">
      화장한 비올레타를 놓치지 말고 주목해주세요.
    </div>
    <div class="stage-area">
      <div class="curtain-l"></div>
      <div class="curtain-r"></div>
      <div class="stage-floor-rail"></div>

      <div class="shroom-lane" id="lane0"><div class="red-arrow-target" id="arrow0">▼</div><div id="shroomArt0"></div></div>
      <div class="shroom-lane" id="lane1"><div class="red-arrow-target" id="arrow1">▼</div><div id="shroomArt1"></div></div>
      <div class="shroom-lane" id="lane2"><div class="red-arrow-target" id="arrow2">▼</div><div id="shroomArt2"></div></div>
      <div class="shroom-lane" id="lane3"><div class="red-arrow-target" id="arrow3">▼</div><div id="shroomArt3"></div></div>
    </div>

    <div class="stage-buttons-row">
      <button class="num-btn" id="btn0" onclick="chooseSlot(0)">1</button>
      <button class="num-btn" id="btn1" onclick="chooseSlot(1)">2</button>
      <button class="num-btn" id="btn2" onclick="chooseSlot(2)">3</button>
      <button class="num-btn" id="btn3" onclick="chooseSlot(3)">4</button>
    </div>
  </div>

  <div class="score-toast" id="scoreBar">Đúng: <b>0</b> | Chuỗi liên tiếp: <b>0</b></div>

  <script>
    // Hàm vẽ chi tiết nhân vật nấm Violetta theo đúng chuẩn MapleStory
    function getViolettaSVG(isMakeup, isClosedEyes) {
      let faceFeatures = '';

      if (isClosedEyes) {
        // Mắt nhắm ngủ khi di chuyển
        faceFeatures = `
          <path d="M 23 37 Q 27 41 31 37" stroke="#2b2d42" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <path d="M 43 37 Q 47 41 51 37" stroke="#2b2d42" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <ellipse cx="21" cy="39" rx="3.5" ry="2" fill="#fb7185" opacity="0.6"/>
          <ellipse cx="53" cy="39" rx="3.5" ry="2" fill="#fb7185" opacity="0.6"/>
        `;
      } else if (isMakeup) {
        // Nấm trang điểm: mắt to long lanh, mi cong, má hồng phấn
        faceFeatures = `
          <ellipse cx="26" cy="35" rx="4.5" ry="6" fill="#18181b"/>
          <circle cx="25" cy="33" r="1.8" fill="#ffffff"/>
          <circle cx="28" cy="37" r="0.9" fill="#ffffff"/>
          <path d="M 21 30 Q 23 27 26 28" stroke="#18181b" stroke-width="2" fill="none"/>
          <path d="M 24 27 Q 27 25 29 27" stroke="#18181b" stroke-width="2" fill="none"/>
          <ellipse cx="20" cy="39" rx="4" ry="2.2" fill="#f43f5e" opacity="0.8"/>

          <ellipse cx="48" cy="35" rx="4.5" ry="6" fill="#18181b"/>
          <circle cx="47" cy="33" r="1.8" fill="#ffffff"/>
          <circle cx="50" cy="37" r="0.9" fill="#ffffff"/>
          <path d="M 53 30 Q 51 27 48 28" stroke="#18181b" stroke-width="2" fill="none"/>
          <path d="M 50 27 Q 47 25 45 27" stroke="#18181b" stroke-width="2" fill="none"/>
          <ellipse cx="54" cy="39" rx="4" ry="2.2" fill="#f43f5e" opacity="0.8"/>
        `;
      } else {
        // Nấm thường: mắt chấm tròn đơn giản
        faceFeatures = `
          <ellipse cx="27" cy="36" rx="3.5" ry="4" fill="#27272a"/>
          <circle cx="26" cy="34" r="1.2" fill="#ffffff"/>
          <ellipse cx="47" cy="36" rx="3.5" ry="4" fill="#27272a"/>
          <circle cx="46" cy="34" r="1.2" fill="#ffffff"/>
        `;
      }

      return `
        <svg width="74" height="84" viewBox="0 0 74 84">
          <path d="M 45 9 L 51 2 L 55 9 L 61 4 L 62 16 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
          <circle cx="53" cy="11" r="1.5" fill="#ef4444"/>

          <ellipse cx="37" cy="26" rx="35" ry="23" fill="#fb7185" stroke="#be123c" stroke-width="2"/>
          <ellipse cx="19" cy="18" rx="6.5" ry="4.5" fill="#ffffff" opacity="0.95"/>
          <ellipse cx="54" cy="18" rx="5.5" ry="4" fill="#ffffff" opacity="0.95"/>
          <ellipse cx="37" cy="13" rx="4.5" ry="3" fill="#ffffff" opacity="0.95"/>
          <ellipse cx="37" cy="27" rx="5.5" ry="3.5" fill="#ffffff" opacity="0.95"/>

          <path d="M 15 31 C 15 50, 59 50, 59 31 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
          
          <path d="M 35 42 Q 37 44 39 42" stroke="#e11d48" stroke-width="2" fill="none" stroke-linecap="round"/>

          ${faceFeatures}
        </svg>
      `;
    }

    document.getElementById('noticeAvatar').innerHTML = getViolettaSVG(true, false);

    let noticeSec = 14;
    let noticeInterval = null;
    let targetShroom = 0; // Con nào là nấm trang điểm (0 - 3)
    let currentSlots = [0, 1, 2, 3]; // Lưu vị trí thực tế
    let score = 0, streak = 0;
    const X_LANES = [65, 190, 315, 440]; // Tọa độ X trên sân khấu

    function startNotice() {
      clearInterval(noticeInterval);
      noticeSec = 14;
      document.getElementById('noticeTimerText').textContent = noticeSec;
      noticeInterval = setInterval(() => {
        noticeSec--;
        document.getElementById('noticeTimerText').textContent = noticeSec;
        if (noticeSec <= 0) {
          clearInterval(noticeInterval);
          startStageImmediately();
        }
      }, 1000);
    }

    function startStageImmediately() {
      clearInterval(noticeInterval);
      document.getElementById('noticeModal').style.display = 'none';
      document.getElementById('stageModal').style.display = 'block';

      for (let i = 0; i < 4; i++) {
        document.getElementById(`btn${i}`).classList.remove('ready');
        document.getElementById(`arrow${i}`).style.display = 'none';
      }

      // Chọn ngẫu nhiên nấm trang điểm
      targetShroom = Math.floor(Math.random() * 4);
      currentSlots = [0, 1, 2, 3];

      // Đặt vị trí ban đầu và mở mắt nhận diện
      for (let i = 0; i < 4; i++) {
        const lane = document.getElementById(`lane${i}`);
        lane.style.transition = 'none';
        lane.style.transform = `translateX(${X_LANES[i]}px)`;
        document.getElementById(`shroomArt${i}`).innerHTML = getViolettaSVG(i === targetShroom, false);
      }

      // Mũi tên đỏ chỉ vào nấm trang điểm trong 2 giây đầu
      document.getElementById(`arrow${targetShroom}`).style.display = 'block';
      document.getElementById('stageBannerText').textContent = "화장한 비올레타를 놓치지 말고 주목해주세요.";

      // Sau 2 giây: Nhắm mắt và bắt đầu chạy từ từ qua lại
      setTimeout(() => {
        document.getElementById(`arrow${targetShroom}`).style.display = 'none';
        document.getElementById('stageBannerText').textContent = "눈을 감고 이동하기 시작합니다... (Đang di chuyển qua lại)";

        // Cả 4 con nhắm mắt lại
        for (let i = 0; i < 4; i++) {
          document.getElementById(`shroomArt${i}`).innerHTML = getViolettaSVG(i === targetShroom, true);
        }

        // Bật chuyển động mượt 0.8 giây
        for (let i = 0; i < 4; i++) {
          document.getElementById(`lane${i}`).style.transition = 'transform 0.8s cubic-bezier(0.45, 0.05, 0.55, 0.95)';
        }

        // Thực hiện 6 lượt tráo từ từ
        let step = 0;
        const shuffleTimer = setInterval(() => {
          let a = Math.floor(Math.random() * 4);
          let b = Math.floor(Math.random() * 4);
          while (b === a) b = Math.floor(Math.random() * 4);

          // Hoán đổi vị trí hiển thị
          let temp = currentSlots[a];
          currentSlots[a] = currentSlots[b];
          currentSlots[b] = temp;

          // Điều chỉnh độ nổi (z-index) để khi trượt ngang không bị đè lỗi
          document.getElementById(`lane${currentSlots[a]}`).style.zIndex = '15';
          document.getElementById(`lane${currentSlots[b]}`).style.zIndex = '12';

          document.getElementById(`lane${currentSlots[a]}`).style.transform = `translateX(${X_LANES[a]}px)`;
          document.getElementById(`lane${currentSlots[b]}`).style.transform = `translateX(${X_LANES[b]}px)`;

          step++;
          if (step >= 6) {
            clearInterval(shuffleTimer);
            setTimeout(() => {
              document.getElementById('stageBannerText').textContent = "화장한 비올레타가 위치한 번호를 누르세요! (Chọn số 1 - 4)";
              for (let i = 0; i < 4; i++) {
                document.getElementById(`btn${i}`).classList.add('ready');
              }
            }, 850);
          }
        }, 950); // Mỗi lượt tráo cách nhau gần 1 giây để mắt người theo kịp
      }, 2000);
    }

    function chooseSlot(userChoice) {
      if (!document.getElementById('btn0').classList.contains('ready')) return;

      for (let i = 0; i < 4; i++) {
        document.getElementById(`btn${i}`).classList.remove('ready');
        // Mở mắt lại toàn bộ để kiểm chứng
        document.getElementById(`shroomArt${i}`).innerHTML = getViolettaSVG(i === targetShroom, false);
      }

      // Vị trí slot thực tế của nấm trang điểm
      const correctSlot = currentSlots.indexOf(targetShroom);

      if (userChoice === correctSlot) {
        score++;
        streak++;
        document.getElementById('stageBannerText').textContent = "★ 통과 (Chính xác! Bạn đã bắt trúng Violetta)";
      } else {
        streak = 0;
        document.getElementById('stageBannerText').textContent = `✖ 실패 (Sai rồi! Violetta nằm ở vị trí số ${correctSlot + 1})`;
      }

      document.getElementById('scoreBar').innerHTML = `Đúng: <b>${score}</b> | Chuỗi liên tiếp: <b>${streak}</b>`;

      setTimeout(() => {
        document.getElementById('stageModal').style.display = 'none';
        document.getElementById('noticeModal').style.display = 'block';
        startNotice();
      }, 2400);
    }

    // Bắt đầu
    startNotice();
  </script>
</body>
</html>
